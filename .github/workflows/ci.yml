name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheapest-first: static checks before anything that needs a build, and a
  # build before anything that needs a browser. A failure earlier in the list
  # saves the minutes the later stages would have spent.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # scripts/generate.mjs fetches one SHA-pinned tarball per repo in
      # repos.json, so the cache key is that file's contents.
      - name: Restore repository tarball cache
        uses: actions/cache@v6
        with:
          path: .cache/repos
          key: repos-${{ hashFiles('repos.json') }}

      # Gitleaks and Trivy land here (PR 4.5).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm architecture
      - run: pnpm format
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # jscpd and knip land here (PR 4.3).

      - run: pnpm test:unit

      # Codacy coverage upload (PR 4.4) and CodeQL (PR 4.5) land here.
      # PR 4.2 adds --coverage to the pnpm test:unit step above.

      - name: Restore Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      # pnpm test:visual must never run before a Pages upload: it overwrites
      # dist/ with fixture bytes.
      - run: pnpm test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
