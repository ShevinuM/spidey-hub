name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A push that lands while an earlier run is still going supersedes it; a
    # build-and-deploy still takes a few minutes, so queued runs would
    # otherwise stack up.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # scripts/generate.mjs fetches one SHA-pinned tarball per repo in
      # repos.json, so the cache key is that file's contents.
      - name: Restore repository tarball cache
        uses: actions/cache@v6
        with:
          path: .cache/repos
          key: repos-${{ hashFiles('repos.json') }}

      # No gate here: .github/workflows/ci.yml already ran on the pull request
      # and branch protection required it green before this push to main
      # could land. Re-running the gate here would only delay the deploy.
      #
      # This builds dist/ from real data, and that build is what deploys.
      # pnpm test:visual would replace dist/ with fixture bytes instead, so
      # anything added after this step must re-run `pnpm build` before the
      # upload below.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Publishing is never cancelled mid-flight, unlike the build above.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
