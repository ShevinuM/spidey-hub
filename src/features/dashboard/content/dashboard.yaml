# Dashboard (home) view copy, mirroring reference/Homepage.dc.html's
# plate/menu/footer block (lines 142-168).

plate:
  title: "SPIDEY-HUB"

# Menu rows, top to bottom.
# `icon` is either a glyph character or the literal token "spider-mask",
# meaning: render the spiderman.svg CSS mask, never an <img>, instead of a
# text glyph.
menu:
  - id: projects
    icon: "▤"
    label: "Repositories"
  - id: xp
    icon: "◆"
    label: "Employment Records"
  - id: info
    icon: "◉"
    label: "Profile"
  - id: tracker
    icon: "spider-mask"
    label: "Retina-V"
  - id: help
    icon: "?"
    label: "Help"

footer:
  # "{n}" appears twice, both replaced with the SAME live pane count
  # (Dashboard.svelte's `paneCount` prop, summed from the tmux model) —
  # never a hardcoded number.
  syncLineTemplate: "⚡ synced {n}/{n} panes in 48.23ms"
  switchingTemplate: "-- switching to window {label} --"
