# Employment Records (flat list + service timeline) view copy. This page
# replaced an older hierarchical drill-down file browser.

breadcrumb: "~/employment-records"

# 2-3 char org tag shown in each row's dim column. Not mechanically
# derivable from the personnel collection's org directory slug
# ("memorial-university" is "mun", not "mem") — hand authored here, keyed
# by the collection's top-level directory segment
# (src/features/employment/content/personnel/<key>/...).
orgTags:
  enaimco: ena
  memorial-university: mun

index:
  orgsLabel: "orgs"
  longestLabel: "longest"
  yearsActiveLabel: "years active"
  longestSuffix: " mo"
  yearsActiveSeparator: " – "

# ls -l-style file metadata shown in the row list and the preview header —
# both literal in the mockup, never computed.
fileOwner: "shev"
filePerms: ".rw-r--r--"

# Top-straddling PanelBadge split text (glyph renders between the two
# words — see PanelBadge.svelte's `left`/`right` split-text mode, added for
# this page since its badges aren't the `{n} · {label}` shape Repositories'
# panels use).
badge:
  recordsLeft: "Employment"
  recordsRight: "Records"
  previewLeft: "File"
  previewRight: "Preview"

previewLineCountTemplate: "{n} lines"

# Enter opens the selected record's role.md in the shared vim-lite editor
# ("j/k/enter selection stays" — the filter/drill-down/`../` are what's
# dropped, not Enter's existing open-in-editor behavior). Mirrors
# repositories.yaml's `editor:` block field-for-field (EditorLabels requires
# every field for Editor.svelte's shared status line); defined independently
# here since this file has no dependency on repositories.yaml. The role doc
# pane never scrolls past one screen in practice, so topLabel/bottomLabel/
# percentTemplate only ever render "Top" here.
editor:
  modeLabel: "NORMAL"
  modeVisualLabel: "VISUAL"
  modeVisualLineLabel: "VISUAL LINE"
  branch: "⑂ main"
  breadcrumbSeparator: "›"
  closePillLabel: "[:q]"
  tabIcon: "▤"
  topLabel: "Top"
  bottomLabel: "Bot"
  percentTemplate: "{n}%"
  positionTemplate: "{line}:{col}"
  searchPromptGlyph: "/"
  cmdlinePromptGlyph: ":"
  readonlyBellMessage: "E21: Cannot make changes, 'modifiable' is off"
  writeReadonlyMessage: "E45: 'readonly' option is set"
  notAnEditorCommandTemplate: "E492: Not an editor command: {cmd}"
