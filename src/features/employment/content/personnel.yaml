breadcrumb: "~/employment-records"

# 2-3 char org tag shown in each row's dim column, hand-authored since it
# isn't mechanically derivable from the org directory slug (e.g.
# "memorial-university" -> "mun", not "mem").
orgTags:
  enaimco: ena
  memorial-university: mun

index:
  orgsLabel: "orgs"
  longestLabel: "longest"
  yearsActiveLabel: "years active"
  longestSuffix: " mo"
  yearsActiveSeparator: " – "

# ls -l-style file metadata shown in the row list and the preview header —
# both literal in the mockup, never computed.
fileOwner: "shev"
filePerms: ".rw-r--r--"

# Uppercase PanelBadge labels for the Records and Preview panes.
badge:
  records: "EMPLOYMENT RECORDS"
  preview: "FILE PREVIEW"

previewLineCountTemplate: "{n} lines"

editor:
  modeLabel: "NORMAL"
  modeVisualLabel: "VISUAL"
  modeVisualLineLabel: "VISUAL LINE"
  branch: "⑂ main"
  breadcrumbSeparator: "›"
  closePillLabel: "[:q]"
  tabIcon: "▤"
  topLabel: "Top"
  bottomLabel: "Bot"
  percentTemplate: "{n}%"
  positionTemplate: "{line}:{col}"
  searchPromptGlyph: "/"
  cmdlinePromptGlyph: ":"
  readonlyBellMessage: "E21: Cannot make changes, 'modifiable' is off"
  writeReadonlyMessage: "E45: 'readonly' option is set"
  notAnEditorCommandTemplate: "E492: Not an editor command: {cmd}"
