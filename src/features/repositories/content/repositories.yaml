# Panel labels are bare (no bracket/dash) — PanelBadge.svelte composes the full "[{n}] {label}" text itself.
panels:
  status:
    label: "Status"
  files:
    label: "Files"
    # {value} is "<repo>" (working tree) or "<repo> @<sha8>" (browsing a commit snapshot); only rendered once a repo has been opened.
    subtitleTemplate: "{value}"
  repos:
    label: "Repositories"
  commits:
    label: "Commits"
    # "{branch} · {count} commits" — real data: branch comes from the
    # panel [1] selection's own RepoRow (all-projects' is "local"), count
    # from the actually-rendered commit list (0 for all-projects).
    subtitleTemplate: "{branch} · {count} commits"
    # Hardcoded, not derived from commit data; real and fixture snapshots both happen to carry "Sh" too, so swapping to `commit.initials` later would be a no-op.
    authorInitials: "Sh"
    # Shown instead of commit rows when the virtual all-projects repo is
    # selected in panel [1] — it isn't a real remote, so there's nothing to
    # fetch commits for.
    localOnlyText: "local only — no remote to fetch commits from"
  changes:
    label: "Content"
    # {value} = "<repo>/<path>" while previewing a file, or "<project-id>.md" before anything's been browsed.
    subtitleTemplate: "{value}"

# Right cluster's "last push" segment only renders when a real commit date is known; frozen fixtures carry none, keeping goldens stable regardless of wall-clock time.
statusLine:
  prefix: "shevinum.dev"
  arrow: "→"
  reposSuffix: "repos"
  mainLabel: "main"
  lastPushTemplate: "last push {value}"
  connectedLabel: "connected"

# Repo tree browsing (panel [1]→[2]→[3]) and the file editor it opens into have no prototype-markup precedent, but every string they render still lives here, not inlined in the components.
repoBrowser:
  loadingText: "Loading repo index…"
  errorText: "Failed to load repo index."
  emptyText: "Select a repo in panel [1] to browse its files."

# Panel [1]'s virtual "all-projects" row: every project's .md doc in one browsable tree, generated by scripts/generate.mjs; not a real git remote, so no branch/commits.
allProjects:
  name: "all-projects"
  branch: "local"
  description: "every project's markdown doc, browsable in one place"

# Animated braille spinner shown on a panel [1] row while ANY fetch for that repo is in flight (index, tree, live-refresh, or file content).
spinner:
  label: "Pulling"
  frames: ["··●", "·●·", "●··", "·●·"]
  ariaLabel: "Fetching…"

# Transient failure message for a commit-tree fetch — whatever panel [2]
# was already showing stays untouched; this is
# just a one-off status line, not a panel takeover.
commitBrowser:
  errorText: "Failed to load that commit's tree — showing the previous view."

# Panel [3] file-preview states while browsing a commit snapshot; working-tree previews render synchronously, so no loading state is needed.
filePreview:
  loadingText: "Loading file…"
  errorText: "Failed to load that file."
  binaryText: "Binary or too large to preview."

# Editor.svelte is generic and reused elsewhere (e.g. personnel.yaml's `editor:` section) — this is Repositories' own copy of those literal strings, not shared storage.
# readonlyBellMessage/writeReadonlyMessage/notAnEditorCommandTemplate mirror real vim's own error text (E21/E45/E492), not invented wording.
editor:
  modeLabel: "NORMAL"
  modeVisualLabel: "VISUAL"
  modeVisualLineLabel: "VISUAL LINE"
  branch: "⑂ main"
  breadcrumbSeparator: "›"
  closePillLabel: "[:q]"
  tabIcon: "▤"
  topLabel: "Top"
  bottomLabel: "Bot"
  percentTemplate: "{n}%"
  positionTemplate: "{line}:{col}"
  searchPromptGlyph: "/"
  cmdlinePromptGlyph: ":"
  readonlyBellMessage: "E21: Cannot make changes, 'modifiable' is off"
  writeReadonlyMessage: "E45: 'readonly' option is set"
  notAnEditorCommandTemplate: "E492: Not an editor command: {cmd}"
