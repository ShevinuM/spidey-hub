# Backs HelpSearch.svelte: empty query lists cmdline.yaml's commands; typing
# fuzzy-searches those commands plus every help scope's keymap rows via
# help-search.ts.

title: "─ Help ─"

prompt:
  glyph: "?"
  cursorGlyph: "▌"

emptyHint: "commands — type to also search keybindings"
noResultsText: "no matches"

# Rendered after a keymap row's own key/description (never after a command
# row — those show cmdline.yaml's own argsPlaceholder instead) so it's clear
# Enter does nothing there.
keymapHint: "reference only"

footer:
  hint: "↑↓ navigate · Enter execute · Esc close"
