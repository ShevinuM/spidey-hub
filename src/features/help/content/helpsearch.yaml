# Site-wide `?` fuzzy help palette — src/features/help/components/HelpSearch.svelte,
# driven by Terminal.svelte. Same visual family as the Cmdline box
# (src/common/content/cmdline.yaml — bordered floating panel, box-drawing inset
# title, `>` prompt + block cursor) but its OWN component/state: empty
# query lists cmdline.yaml's own site-wide `commands` list; typing
# fuzzy-searches those commands PLUS every help scope's keymap row
# (src/features/help/content/*.md, src/features/help/lib/help-search.ts owns
# the scoring — pure, unit-tested, no DOM).

title: "─ Help ─"

prompt:
  glyph: "?"
  cursorGlyph: "▌"

emptyHint: "commands — type to also search keybindings"
noResultsText: "no matches"

# Rendered after a keymap row's own key/description (never after a command
# row — those show cmdline.yaml's own argsPlaceholder instead, same as the
# old Cmdline suggestion list did) so it's clear Enter does nothing there.
keymapHint: "reference only"

footer:
  hint: "↑↓ navigate · Enter execute · Esc close"
