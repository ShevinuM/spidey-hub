# E.D.I.T.H boot sequence copy + config. Geometry (ring sizes, tick-mark
# positions/rotations, keyframe timings/delays) stays inline in
# BootSequence.svelte, matching Wallpaper.svelte's convention — only textual
# content and config knobs (bootMs/coreTint/showBootLog) live here. The boot
# log's own text (label/val) lives in content/log.md; `log:` below keeps
# only each row's timing/tag, joined by `id`.

bootMs: 4600
# "cyan" is the only variant actually rendered; `tints` below keeps all
# three palettes on file so a future change of this value is a data edit,
# not a code change.
coreTint: cyan
showBootLog: true

sessionId: "10.42.7.13"
# "{session}" is substituted with sessionId above.
commandLineTemplate: "$ edith --boot --session {session}"

handshake:
  label: "e.d.i.t.h core handshake ....... "
  ready: "OK · 0.94 / 0.91"
  negotiating: "negotiating"

phaseLabels:
  init: "INIT"
  scan: "SCAN"
  link: "LINK"
  lock: "LOCK"
  ready: "READY"

coreLabel: "E.D.I.T.H"

# Compass ring furniture — visible glyphs, so they live here even though
# their positions are pure geometry (inline in the component, like
# Wallpaper's ring/tick treatment).
compass:
  top: "▼"
  bottom: "▲"
  left: "◀"
  right: "▶"
  degrees: ["000", "090", "180", "270"]

# The `┌─…─┐`/`└─…─┘` border rows are stored verbatim; each row's `prefix`
# is the literal text up to (not including) the 16-char padded value, so
# the box's fixed-width alignment stays exact. `threshold`/`onlineText`
# feed lib/boot.ts's statusRowValue().
statusBox:
  top: "┌─ e.d.i.t.h ───────────────────────┐"
  bottom: "└───────────────────────────────────┘"
  rowSuffix: "│"
  rows:
    - prefix: "│ core ............ "
      threshold: 14
      onlineText: "ONLINE"
    - prefix: "│ session ......... "
      threshold: 30
      onlineText: "10.42.7.13"
    - prefix: "│ windows ......... "
      threshold: 44
      onlineText: "6 MAPPED"
    - prefix: "│ retina-v ........ "
      threshold: 62
      onlineText: "02 LOCKED"
    - prefix: "│ lock ............ "
      threshold: 84
      onlineText: "0.94 / 0.91"

bootLogTitle: "── boot log ──────────────────"

# Boot log timing/tag config, in display order. `threshold` is the 0..1
# progress fraction at which a row becomes visible; `tag` picks its
# glyph/color. Row text (label/val) lives in content/log.md, matched by
# `id`.
log:
  - id: mounting-shell
    threshold: 0.02
    tag: ok
  - id: hydrating-island
    threshold: 0.10
    tag: ok
  - id: tmux-session
    threshold: 0.18
    tag: ok
  - id: grep-index
    threshold: 0.27
    tag: ok
  - id: repo-trees
    threshold: 0.36
    tag: ok
  - id: commit-snapshots
    threshold: 0.45
    tag: ok
  - id: retina-v-optics
    threshold: 0.55
    tag: ok
  - id: retina-v-feed
    threshold: 0.64
    tag: ok
  - id: retina-v-lock
    threshold: 0.73
    tag: ok
  - id: retina-v-anomaly
    threshold: 0.82
    tag: warn
  - id: wallpaper-radar
    threshold: 0.90
    tag: ok
  - id: edith-online
    threshold: 0.96
    tag: done

# Full palette per tint; only `tints[coreTint]` above is ever rendered.
# Fields map onto the core-readout circle's inline styles: border/glowStart/
# glowEnd build the radial-gradient, shadowInset/shadowOuter the box-shadow,
# labelColor/pctColor/phaseColor the caption/percentage/phase text.
tints:
  cyan:
    border: "rgba(95,198,180,.55)"
    glowStart: "rgba(95,198,180,.24)"
    glowEnd: "rgba(9,13,18,.92)"
    shadowInset: "rgba(95,198,180,.16)"
    shadowOuter: "rgba(95,198,180,.12)"
    labelColor: "rgba(234,250,246,.7)"
    pctColor: "#eafaf6"
    phaseColor: "#5fc6b4"
  red:
    border: "rgba(224,69,60,.6)"
    glowStart: "rgba(224,69,60,.22)"
    glowEnd: "rgba(9,13,18,.92)"
    shadowInset: "rgba(224,69,60,.16)"
    shadowOuter: "rgba(224,69,60,.12)"
    labelColor: "rgba(244,236,233,.7)"
    pctColor: "#f4ece9"
    phaseColor: "#e0453c"
  gold:
    border: "rgba(217,176,74,.6)"
    glowStart: "rgba(217,176,74,.2)"
    glowEnd: "rgba(9,13,18,.92)"
    shadowInset: "rgba(217,176,74,.16)"
    shadowOuter: "rgba(217,176,74,.1)"
    labelColor: "rgba(244,240,229,.7)"
    pctColor: "#f6efe0"
    phaseColor: "#d9b04a"
