# Grep overlay copy, ported from reference/Homepage.dc.html's
# grepHits()/renderVals() (lines 812-832, 1039-1070).

leftPane:
  titlePrefix: "GREP "
  titleTilde: "〜"
  promptIcon: "❯"
  # The blinking prompt cursor glyph (Homepage.dc.html line 409's `▌`,
  # `animation:blk 1.05s steps(1) infinite` — the component copies that
  # animation declaration verbatim so Playwright's frozen-animation frame
  # matches the goldens).
  cursorGlyph: "▌"

modeLine:
  # qLen ? liveGrep : repoFiles — Component.renderVals() line 1044.
  liveGrep: "live_grep · shevinum.dev@main"
  repoFiles: "repo files · shevinum.dev@main"

# Loading/error text for the lazy index fetch — no prototype precedent
# (repoSrc was inline data), so this mirrors RepoBrowserData's own
# loadingText/errorText convention.
loadingText: "loading index…"
errorText: "grep index unavailable"

# Position-pill templates (Component.renderVals() lines 1064/1080) — the
# "{n} lines" match snippet text itself comes from grep.ts's tested
# search() output, not from here.
rowPosTemplate: ":{line}:{col}"
filePosTemplate: "{line}:{col}"
fileLinesTemplate: "{n} lines"

# "no matches in {n} tracked files" — the prototype hardcoded n=22 (a
# miscount versus its real 24-entry repoSrc); {n} here is interpolated
# from the real index length instead.
emptyStateTemplate: "no matches in {n} tracked files"

noResultsFile: "no results"

footer:
  hintsLeft: "type to filter · ↑↓ or ctrl-n/p moves · enter opens the pane · esc closes"
  closeHint: "[esc] close"
