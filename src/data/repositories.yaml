# Repositories (lazygit clone) view copy. Source: design/Homepage.dc.html
# lines 322-382. Panel numbers/titles match the prototype's inset labels;
# panel [0] "Changes" and the command-log panel are unnumbered there too.
#
# Repositories' interaction model goes beyond
# what the prototype markup shows any precedent for (same "Repositories
# interactivity extension" territory as the original repo-file
# browsing): panel [3] becomes a flat list of every repo across every
# project plus a virtual "all-projects" entry, panel [2] becomes that
# selection's tree browser, panel [0] previews whatever file is highlighted
# in the tree, and panel [4] tracks only the panel [3] selection (never file/
# project movement — a fix for a live user bug report of commits changing
# while browsing files). Every new user-visible string this introduces still
# lives here, not inlined in Repositories.svelte.

panels:
  status:
    title: "─[1]─Status"
  files:
    title: "─[2]─Files"
    # "- {value}" where {value} is "<repo>" for a repo's working tree, or
    # "<repo> @<sha8>" while browsing a commit snapshot. Only rendered once a repo has been opened — see
    # repoBrowser.emptyText below for the state before that.
    subtitleTemplate: "- {value}"
  repos:
    title: "─[3]─Local Repositories"
  commits:
    title: "─[4]─Commits"
    subtitle: "- main"
    # Author initials shown next to every commit sha — hardcoded in the
    # prototype markup (not derived from commit data); fixtures/real commit
    # snapshots both carry "Sh" per-commit too so either source works if this
    # literal is ever swapped for `commit.initials`.
    authorInitials: "Sh"
    # Shown instead of commit rows when the virtual all-projects repo is
    # selected in panel [3] — it isn't a real remote, so there's nothing to
    # fetch commits for.
    localOnlyText: "local only — no remote to fetch commits from"
  changes:
    title: "─[0]─Changes"
    # "- {value}" (prototype line 379). {value} = "<repo>/<path>" for the
    # file currently previewed, or "<project-id>.md" for the default project
    # doc shown before anything has been browsed.
    subtitleTemplate: "- {value}"
  commandLog:
    title: "─Command log"

# "{repoCount} repos · {projectCount} projects tracked" — status line inside
# the Status panel (line 329). repoCount already counts every repo across
# every project (not just one project's), so this needed no change for the
# panel [3] flat-list rework.
statusLine:
  prefix: "shevinum.dev"
  arrow: "→"
  reposSuffix: "repos"
  separator: "·"
  projectsSuffix: "projects tracked"

commandLog:
  - text: "Select a repo with the arrow keys in panel [3] — Enter (or a click) loads its tree into panel [2]."
    emphasize: ["arrow keys"]
  - text: "Open the source on github.com/shevinum · live build at shevinum.dev"
    links:
      - text: "github.com/shevinum"
        href: "https://github.com/shevinum"
      - text: "shevinum.dev"
        href: "https://shevinum.dev"
  - text: "Ctrl-b 3 for Retina-V · Ctrl-b ? for help."
    emphasize: ["Ctrl-b 3"]

# Repo file-tree browsing (panel [3] -> panel [2] -> pane [0]) and the
# full-screen nvim-style file editor it opens into. Both are a
# "Repositories interactivity extension" beyond the prototype's visuals (no
# prototype markup exists for either), but every user-visible string they
# render still lives here, not inlined in Repositories.svelte / Editor.svelte.
repoBrowser:
  # The Files pane is a lazygit-style tree now
  # (Repositories.svelte renders inline SVG folder/file icons + a ▾/▸ caret keyed
  # off each row's own type/expand-state, not a yaml glyph) and there is no
  # more `../` row to navigate to (the whole tree renders at once) — both
  # `upEntry` and the `dirIcon`/`fileIcon` glyphs are retired.
  loadingText: "Loading repo index…"
  errorText: "Failed to load repo index."
  emptyText: "Select a repo in panel [3] to browse its files."

# Panel [3]'s virtual "all-projects" row: every
# project's .md doc in one browsable tree (public/generated/repos/all-projects.json,
# emitted by scripts/generate.mjs from src/content/repositories/*.md — see that
# script's own comment). Not a real git remote: no branch to track, no
# commits (see panels.commits.localOnlyText above).
allProjects:
  name: "all-projects"
  branch: "local"
  description: "every project's markdown doc, browsable in one place"

# Lazygit-style animated braille spinner shown on a panel [3] repo row while
# ANY fetch for that repo is in flight (working-tree index, a commit's tree,
# a commit's live-refresh, or a file's content at a commit). Frames
# cycle at a fixed interval; `label` + the current frame render as one
# string ("Pulling ··●").
spinner:
  label: "Pulling"
  frames: ["··●", "·●·", "●··", "·●·"]
  ariaLabel: "Fetching…"

# Transient failure message for a commit-tree fetch — whatever panel [2]
# was already showing stays untouched; this is
# just a one-off status line, not a panel takeover.
commitBrowser:
  errorText: "Failed to load that commit's tree — showing the previous view."

# Panel [0] file-preview states while browsing a commit snapshot (working-
# tree file previews render synchronously, no loading state needed).
# Binary/oversize guard: a decode failure shows the 'binary or too large'
# message line.
filePreview:
  loadingText: "Loading file…"
  errorText: "Failed to load that file."
  binaryText: "Binary or too large to preview."

# Editor.svelte is generic (built standalone so it can be reused
# for personnel role docs); every
# caller passes its own labels object sourced from its own data file. This is
# the Repositories caller's copy of those literal strings — identical wording to
# personnel.yaml's `editor:` section (src/data/personnel.yaml) because both
# reproduce the same prototype markup (Homepage.dc.html lines 317-336:
# "NORMAL", "⑂ main"), not because the two data files share storage.
#
# This block also carries VISUAL/
# VISUAL-LINE mode labels, the search/cmdline prompt glyphs, the `[:q]`
# close-pill label (Esc
# no longer closes the editor, only `:q`/`:q!` do), and the three vim-style
# status messages (readonly bell, `:w` error, `:<unknown>` E492). The
# `readonlyBellMessage`/`writeReadonlyMessage`/`notAnEditorCommandTemplate`
# wording below mirrors real vim's own error text (E21/E45/E492) —
# vim-faithful, not invented.
editor:
  modeLabel: "NORMAL"
  modeVisualLabel: "VISUAL"
  modeVisualLineLabel: "VISUAL LINE"
  branch: "⑂ main"
  breadcrumbSeparator: "›"
  closePillLabel: "[:q]"
  tabIcon: "▤"
  topLabel: "Top"
  bottomLabel: "Bot"
  percentTemplate: "{n}%"
  positionTemplate: "{line}:{col}"
  searchPromptGlyph: "/"
  cmdlinePromptGlyph: ":"
  readonlyBellMessage: "E21: Cannot make changes, 'modifiable' is off"
  writeReadonlyMessage: "E45: 'readonly' option is set"
  notAnEditorCommandTemplate: "E492: Not an editor command: {cmd}"
