# Builds (lazygit clone) view copy. Source: design/Homepage.dc.html
# lines 322-382. Panel numbers/titles match the prototype's inset labels;
# panel [0] "Changes" and the command-log panel are unnumbered there too.

panels:
  status:
    title: "─[1]─Status"
  files:
    title: "─[2]─Files"
    subtitle: "- projects/*.md"
    # Literal decorative text between the "M" (git status letter, always
    # shown regardless of real status) and the filename — verbatim from the
    # prototype markup, not a template variable.
    statusLetter: "M"
    filler: "{}"
  repos:
    title: "─[3]─Local Repositories"
  commits:
    title: "─[4]─Commits"
    subtitle: "- main"
    # Author initials shown next to every commit sha — hardcoded in the
    # prototype markup (not derived from commit data); fixtures/real commit
    # snapshots both carry "Sh" per-commit too so either source works if this
    # literal is ever swapped for `commit.initials`.
    authorInitials: "Sh"
  changes:
    title: "─[0]─Changes"
    # "- {activeFile}" (prototype line 379). Reused verbatim for the repo
    # file-tree browsing extension (panel [3] focused, no prototype
    # precedent) with {value} = "{repoName}/{path}" instead of the active
    # project's filename.
    subtitleTemplate: "- {value}"
  commandLog:
    title: "─Command log"

# "{repoCount} repos · {projectCount} projects tracked" — status line inside
# the Status panel (line 329).
statusLine:
  prefix: "shevinum.dev"
  arrow: "→"
  reposSuffix: "repos"
  separator: "·"
  projectsSuffix: "projects tracked"

# "{n} of {total}" position indicator under the Files list (line 338).
filePosTemplate: "{n} of {total}"

commandLog:
  - text: "Select a project with j/k — panel [2] lists one .md per project."
    emphasize: ["j", "k"]
  - text: "Open the source on github.com/shevinum · live build at shevinum.dev"
    links:
      - text: "github.com/shevinum"
        href: "https://github.com/shevinum"
      - text: "shevinum.dev"
        href: "https://shevinum.dev"
  - text: "Press t for E.D.I.T.H: Retina-V · Ctrl-b ? for help."
    emphasize: ["t"]

# Repo file-tree browsing (panel [3] focused -> pane [0]) and the full-screen
# nvim-style file editor it opens into. Both are a PLAN.md "Builds
# interactivity extension" beyond the prototype's visuals (no prototype
# markup exists for either), but every user-visible string they render still
# lives here, not inlined in Builds.svelte / Editor.svelte.
repoBrowser:
  upEntry:
    icon: "▸"
    name: "../"
  dirIcon: "▸"
  fileIcon: "▤"
  loadingText: "Loading repo index…"
  errorText: "Failed to load repo index."

# Editor.svelte is generic (Phase 5 builds it standalone so Phase 6 can reuse
# it for personnel role docs — see PLAN.md Phase 5 scope item 3); every
# caller passes its own labels object sourced from its own data file. This is
# the Builds caller's copy of those literal strings — identical wording to
# personnel.yaml's `editor:` section (src/data/personnel.yaml) because both
# reproduce the same prototype markup (Homepage.dc.html lines 317-336:
# "NORMAL", "⑂ main", "esc to close"), not because the two data files share
# storage.
editor:
  modeLabel: "NORMAL"
  branch: "⑂ main"
  breadcrumbSeparator: "›"
  closeHint: "esc to close"
  tabIcon: "▤"
  topLabel: "Top"
  bottomLabel: "Bot"
  percentTemplate: "{n}%"
  positionTemplate: "{line}:{col}"
