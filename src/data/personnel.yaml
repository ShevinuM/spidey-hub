# Personnel Files (yazi clone) view copy.
# Source: design/Homepage.dc.html lines 258-320 and Component.renderVals()
# (xpPath/xpHint templates, lines 1073, 1083).

# "/Users/Shev/Experience/" (+ "{company}/" when inside a company folder) —
# Component.renderVals() line 1073.
pathPrefix: "/Users/Shev/Experience/"

insetTitles:
  # PLAN.md Phase 1 item 11 rename (renumbered from #5 "Renames").
  fileBrowser: "─ Personnel Files ─"
  filePreview: "File Preview"

promptIcon: ">"

# Hint line under the role table / doc pane (Component.renderVals() line
# 1083). {file} / {company} / {type} are interpolated. PLAN.md Phase 1
# items 15/16 (q/Esc navigation removed sitewide) reword the trailing
# clause away from "q returns to the dashboard" — navigation is now Ctrl-b
# / status-bar clicks / the dashboard menu, never a bare key, so the hint
# points at the help window instead.
#
# PLAN.md Phase 2 item 8: `atTypeLevel` is the new middle-level hint (the
# employment-type browser sitting between companies and role files).
hints:
  atRoleLevel: "enter opens {file} in nvim · h goes back · Ctrl-b ? for help"
  atCompanyLevel: "enter opens {company}/ · j/k moves · Ctrl-b ? for help"
  atTypeLevel: "enter opens {type}/ · h goes back · Ctrl-b ? for help"

upEntry:
  icon: "▸"
  name: "../"

companyRowIcon: "▸"
roleRowIcon: "▤"

# Company row meta, e.g. "3 roles" / "1 role" (Component.renderVals() line
# 1030: `c.roles.length + (c.roles.length > 1 ? " roles" : " role")`).
roleCountTemplate: "{n} {word}"
roleWordSingular: "role"
roleWordPlural: "roles"

# PLAN.md Phase 2 item 8: employment-type row meta at level 1, e.g.
# "1 role" — same `{n} {word}` shape as roleCountTemplate above, reusing
# roleWordSingular/roleWordPlural (a new template key, not new words).
typeRoleCountTemplate: "{n} {word}"

# File Browser footer position indicator, e.g. "2 / 4" (Component.renderVals()
# line 1090: `(lvl===1?ri+1:ci+1) + " / " + (...)`) — same templating
# convention as builds.yaml's `filePosTemplate`, defined independently here.
posTemplate: "{n} / {total}"

# Mirrors builds.yaml's `editor:` section values (Homepage.dc.html lines
# 317-336: "NORMAL", "⑂ main", "esc to close", "▤", "Top"/"Bot", position
# templates) — defined independently here, not imported from builds.yaml,
# since this file has no dependency on Builds' data. The role doc pane
# never scrolls in the prototype (a role doc always fits), so topLabel/
# bottomLabel/percentTemplate only ever render "Top" here in practice, but
# EditorLabels requires all 9 fields for Editor.svelte's shared status line.
editor:
  modeLabel: "NORMAL"
  branch: "⑂ main"
  breadcrumbSeparator: "›"
  closeHint: "esc to close"
  tabIcon: "▤"
  topLabel: "Top"
  bottomLabel: "Bot"
  percentTemplate: "{n}%"
  positionTemplate: "{line}:{col}"
