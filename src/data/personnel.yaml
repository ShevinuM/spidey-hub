# Employment Records (flat list + service timeline) view copy.
# Source: UI-Mockups/builds-page-design-review/Personnel.dc.html +
# Personnel-Panel-Changes.md (iteration 6 rebuild — see
# docs/changes/employment-records-v2.md for the full diff against the old
# drill-down browser this replaced).

breadcrumb: "~/employment-records"

# 2-3 char org tag shown in each row's dim column. Not mechanically
# derivable from the personnel collection's org directory slug
# ("memorial-university" is not "mem" in the mockup, it's "mun") — hand
# authored here, keyed by the collection's top-level directory segment
# (src/content/personnel/<key>/...).
orgTags:
  enaimco: ena
  memorial-university: mun

index:
  orgsLabel: "orgs"
  longestLabel: "longest"
  yearsActiveLabel: "years active"
  longestSuffix: " mo"
  yearsActiveSeparator: " – "

# ls -l-style file metadata shown in the row list and the preview header —
# both literal in the mockup, never computed.
fileOwner: "shev"
filePerms: ".rw-r--r--"

# Top-straddling PanelBadge split text (glyph renders between the two
# words — see PanelBadge.svelte's `left`/`right` split-text mode, added for
# this page since its badges aren't the `{n} · {label}` shape Repositories'
# panels use).
badge:
  recordsLeft: "Employment"
  recordsRight: "Records"
  previewLeft: "File"
  previewRight: "Preview"

previewLineCountTemplate: "{n} lines"
