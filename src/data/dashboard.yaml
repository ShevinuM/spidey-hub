# Dashboard (home) view copy.
# Source: design/Homepage.dc.html lines 130-154 (plate, menu, footer),
# lines 104-124 (toasts).

plate:
  title: "SHEVINUM.DEV"
  welcomePrefix: "welcome back, shev! "

# Menu rows, top to bottom. `invert` marks the single leading character
# rendered with the inverted background:color swap (only "Builds", where the
# "B" is inverted — design/Homepage.dc.html line 142). `icon` is either a
# glyph character or the literal token "spider-mask" meaning: render the
# spiderman.svg CSS mask (never an <img>) instead of a text glyph, exactly
# like the "E.D.I.T.H: Retina-V" row and the plate's welcome-line glyph.
menu:
  - id: projects
    icon: "▤"
    label: "Builds"
    invert: "B"
    hotkey: "b"
  - id: xp
    icon: "◆"
    label: "Personnel Files"
    hotkey: "x"
  - id: info
    icon: "◉"
    label: "Profile"
    hotkey: "i"
  - id: tracker
    icon: "spider-mask"
    label: "E.D.I.T.H: Retina-V"
    hotkey: "t"
  - id: help
    icon: "?"
    label: "Help"
    hotkey: "?"

footer:
  syncLine: "⚡ tracker synced 8/8 panes in 48.23ms"
  # "-- switching to window {label} --" — dead code in the prototype: every
  # menu id (projects/xp/tracker/info) has an explicit early-return branch in
  # open() that never falls through to this message, so it's unreachable in
  # practice. Kept verbatim in case a future menu entry lacks a dedicated
  # view and needs the generic transition message.
  switchingTemplate: "-- switching to window {label} --"

toasts:
  # Shared "✕" dismiss glyph (design/Homepage.dc.html lines 127, 136) — one
  # glyph, both toasts, kept in data alongside the badge icons above for
  # the same reason (no toast iconography hardcoded in src/components).
  closeIcon: "✕"
  danger:
    # "!" glyph inside the round badge circle (design/Homepage.dc.html line
    # 126) — kept in data (not hardcoded in the component) so no toast
    # copy/iconography lives in src/components.
    icon: "!"
    badge: "Danger"
    prefix: "Flerken Detected. Threat Level "
    emphasis: "High"
    suffix: "."
  tracker:
    icon: "i"
    badge: "Tracker"
    prefix: "Location Identified : "
    emphasis: "Latveria"
    suffix: ""
