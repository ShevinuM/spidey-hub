    badge: "Signal"
    text: "Runs in cycles: years of heads-down building, then a long stretch of solo travel."
  - id: signal-hiking-reading
    icon: "i"
    badge: "Signal"
    text: "Outside of code: hiking, the outdoors, and a reading stack that's mostly fantasy and psychology."
  - id: signal-jung-briggs
    icon: "i"
    badge: "Signal"
    text: "Jung and Briggs never get old. Cognitive psychology is a genuine hobby here, not a buzzword."
  - id: signal-board-games
    icon: "i"
    badge: "Signal"
    text: "Board games bring out an aggressively competitive streak. Ask anyone who's played with him."
  - id: signal-architecture-goal
    icon: "i"
    badge: "Signal"
    text: "Long-term goal: systems architecture and design. Ambitious, and openly so."
  - id: signal-mcu-return
    icon: "i"
    badge: "Signal"
    text: "Fell off the MCU after Phase 4. Brand New Day and Doomsday pulled him right back in."
  - id: signal-secret-wars
    icon: "i"
    badge: "Signal"
    text: "Hickman's Secret Wars is the reason the MCU is back on the watchlist."
  - id: signal-scratch-own-itch
    icon: "i"
    badge: "Signal"
    text: "Most projects here started as solutions to problems he ran into himself first."
  - id: signal-problem-solving
    icon: "i"
    badge: "Signal"
