    text: "Tracker note: subject responds to 'Spider-Man' but can't say why it fits."
  - id: tracker-wrist-twitch
    icon: "!"
    badge: "Tracker"
    text: "Half-remembered instinct: hands twitch toward a wrist that used to hold something."
  - id: tracker-no-record
    icon: "!"
    badge: "Tracker"
    text: "Battleworld log: no record of a life before the barons. Every domain looks like someone else's memory."
  - id: tracker-enhanced-reflexes
    icon: "!"
    badge: "Tracker"
    text: "Diagnostic: reflexes flagged 'enhanced.' Origin unknown. Subject also unknown, to himself."
  - id: tracker-body-remembers
    icon: "!"
    badge: "Tracker"
    text: "Field note: he ducks incoming debris before he consciously sees it. The body remembers what the mind doesn't."
  - id: tracker-no-next-of-kin
    icon: "!"
    badge: "Tracker"
    text: "Tracker: no next-of-kin on file, no hometown. Just a signal moving through Battleworld, alone."
  - id: tracker-humming-jingle
    icon: "!"
    badge: "Tracker"
    text: "Log entry: found humming a jingle he can't place, to a city he's never heard of."
  - id: tracker-uncle-flinch
