# Signal inbox: bell/panel/toast copy (`ui`) + the notification content pool
# (`pool`) src/lib/notificationStore.ts injects 2 unseen entries from on every
# visit. Every entry is in-universe SpideyHub/E.D.I.T.H product flavor — a
# notification the app itself would plausibly send, never real-world trivia.
# `sev` is one of alert|warn|info (drives the row/toast color + glyph, see
# notificationStore.ts's SEVERITY_META — not repeated here since it's a
# fixed 3-way enum, not editable prose).

ui:
  bellTitle: "Signal inbox — press n"
  badge: "E.D.I.T.H."
  title: "signal inbox"
  version: "v2.6"
  feedStatusUnread: "{n} unread"
  feedStatusClear: "all clear"
  closeGlyph: "✕"
  tabs:
    inbox: "inbox"
    alerts: "alerts"
    archive: "archive"
    spam: "web·trap"
  spamBanner: "caught in the web — nothing here reaches the toast layer"
  emptyGlyph: "🕸"
  empty:
    inbox: "inbox clear — the web is quiet"
    alerts: "no active alerts · spider-sense idle"
    archive: "nothing archived yet"
    spam: "web-trap empty"
  readTitleMarkRead: "mark as read"
  readTitleMarkUnread: "mark as unread"
  dismissTitleArchive: "dismiss to archive"
  dismissTitleDelete: "delete"
  dismissGlyphArchive: "✕"
  dismissGlyphDelete: "⌫"
  spamActionTitle: "mark as spam"
  spamActionGlyph: "⌗"
  footerHints:
    - key: "n"
      label: "toggle"
    - key: "esc"
      label: "close"
  markAllRead: "mark all read"

pool:
  - id: symbiote-signature-pane4
    sev: alert
    title: "Symbiote signature @ pane 4"
    body: "Retina-V flagged an unregistered mask in the Brooklyn feed."
    src: "edith/retina-v"
  - id: rooftop-sensor-queens
    sev: alert
    title: "Rooftop sensor offline"
    body: "Queens grid node 12 stopped reporting 4 minutes ago."
    src: "grid/queens"
  - id: spider-sense-spike
    sev: alert
    title: "Spider-sense spike — 4 blocks north"
    body: "Threat vector unresolved. Recommend a visual sweep."
    src: "edith/retina-v"
  - id: unregistered-mask-oscorp
    sev: alert
    title: "Unregistered mask @ Oscorp roof"
    body: "Retina-V confidence 0.91. No match in personnel files."
    src: "edith/retina-v"
  - id: grid-node-hard-down
    sev: alert
    title: "Grid node 12 hard down"
    body: "Queens rooftop sensor lost power. Blind spot: 6 blocks."
    src: "grid/queens"
  - id: web-shooter-cartridge-empty
    sev: alert
    title: "Web-shooter cartridge empty"
    body: "Left wrist unit reads zero. Swap the cartridge before the next patrol."
    src: "suit/telemetry"
  - id: perimeter-breach-warehouse
    sev: alert
    title: "Perimeter breach — Pier 40 warehouse"
    body: "Motion logged on 3 sensors in nine seconds. No visual confirmation yet."
    src: "grid/piers"
  - id: signal-jammed-midtown
    sev: alert
    title: "Signal jammed near Midtown tower"
    body: "Retina-V lost the feed for 40 seconds. Cause unknown."
    src: "edith/retina-v"
  - id: build-2291-drifted
    sev: warn
    title: "Build #2291 drifted"
    body: "Web-shooter firmware pipeline finished with 3 warnings."
    src: "ci/web-shooter"
  - id: personnel-file-locked
    sev: warn
    title: "Personnel file locked"
    body: "Record OSC-06 requires level-9 clearance to open."
    src: "personnel"
  - id: web-fluid-reserve-low
    sev: warn
    title: "Web-fluid reserve at 22%"
    body: "Refill before the next patrol window."
    src: "suit/telemetry"
  - id: tracker-latency-high
    sev: warn
    title: "Tracker latency 840ms"
    body: "EU relay degraded — falling back to the Queens node."
    src: "tracker/eu"
  - id: suit-battery-low
    sev: warn
    title: "Suit battery at 18%"
    body: "Return to the loft or swap the cell within 40 minutes."
    src: "suit/telemetry"
  - id: personnel-sync-partial
    sev: warn
    title: "Personnel sync partial"
    body: "2 of 14 records didn't refresh — retry from the Personnel view."
    src: "personnel"
  - id: retina-v-calibration-drift
    sev: warn
    title: "Retina-V calibration drift"
    body: "Optics reading 0.87 confidence — recommend a recalibration pass."
    src: "edith/retina-v"
  - id: grep-index-stale
    sev: warn
    title: "Grep index a day stale"
    body: "Newest commits aren't searchable yet — a rebuild is queued."
    src: "ci/grep-index"
  - id: session-storage-near-cap
    sev: warn
    title: "Signal inbox near capacity"
    body: "Archive is holding a lot of old entries — consider clearing it out."
    src: "edith/inbox"
  - id: session-idle-warning
    sev: warn
    title: "Session idle 20 minutes"
    body: "10.42.7.13 hasn't seen a keystroke — auto-lock in 10 more."
    src: "tmux/daemon"
  - id: spiderman-sighted-berlin
    sev: info
    title: "Spider-Man sighted in Berlin"
    body: "Tracker confirmed the sighting — 8 corroborating signals."
    src: "tracker/eu"
  - id: session-resynced
    sev: info
    title: "Session resynced"
    body: "10.42.7.13 reattached cleanly after a brief drop."
    src: "tmux/daemon"
  - id: build-2292-green
    sev: info
    title: "Build #2292 green"
    body: "Web-shooter firmware shipped in 1m 12s."
    src: "ci/web-shooter"
  - id: pane-3-reattached
    sev: info
    title: "Pane 3 reattached"
    body: "Personnel files restored from snapshot 0x4f."
    src: "tmux/daemon"
  - id: spiderman-takes-bus-istanbul
    sev: info
    title: "Spider-Man takes the bus in Istanbul"
    body: "Tracker confirmed — 12 corroborating signals."
    src: "tracker/eu"
  - id: daily-bugle-quote-request
    sev: info
    title: "DAILY BUGLE wants a quote"
    body: "Third request today. Attachment stripped by the web filter."
    src: "mail/bugle"
  - id: new-personnel-record-added
    sev: info
    title: "New personnel record added"
    body: "A profile was appended to the roster — check Personnel Files."
    src: "personnel"
  - id: retina-v-lock-confirmed
    sev: info
    title: "Retina-V lock confirmed"
    body: "Optics steady at 0.94 / 0.91 — no action needed."
    src: "edith/retina-v"
  - id: wallpaper-radar-quiet
    sev: info
    title: "Radar sweep quiet"
    body: "No new signatures across the last three passes."
    src: "edith/radar"
  - id: commit-snapshot-refreshed
    sev: info
    title: "Commit snapshots refreshed"
    body: "All tracked repos pulled their latest history."
    src: "ci/commits"
  - id: free-web-fluid-spam
    sev: info
    title: "\"You have won 6 web-fluid cartridges\""
    body: "Sender spoofed oscorp-labs.co · quarantined on arrival."
    src: "mail/unknown"
  - id: help-search-tip
    sev: info
    title: "Tip: the command search remembers you"
    body: "Press ? anywhere to reopen it with your last query pre-filled."
    src: "edith/help"
