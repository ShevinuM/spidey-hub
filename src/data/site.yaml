# Shared, cross-view copy: the tmux status bar and global keymap hints.
# Source: design/Homepage.dc.html lines 427-446 (status bar), README.md
# "Mobile policy" (mobile-block card), "Keymap (global)".

statusBar:
  session: "Session: 10.42.7.13"
  separator: "·"
  # Window list, always rendered in this numeric order 0-5 (bug fix 1: the
  # prototype's Retina-V view renders "...4:profile 3:retina-v*" — out of
  # order — because the tracker window is appended after profile instead of
  # rendered in place; we always render 0-5 with the active one highlighted
  # in place instead of reordered). PLAN.md Phase 1 "Window list becomes
  # 0:dashboard 1:builds 2:personnel 3:retina-v 4:profile 5:help" — dashboard
  # and help are real, clickable windows now, not implicit/absent.
  windows:
    - number: 0
      id: dashboard
      name: dashboard
    - number: 1
      id: builds
      name: builds
    - number: 2
      id: personnel
      name: personnel
    - number: 3
      id: retina-v
      name: retina-v
    - number: 4
      id: profile
      name: profile
    - number: 5
      id: help
      name: help
  grepHint: "[/] grep"
  # tmux-style status-line prompt templates (PLAN.md Phase 5 item 5.1 / #12).
  # `{...}` placeholders are the same convention every other data.ts template
  # already uses (grep.yaml's filePosTemplate, builds.yaml's
  # subtitleTemplate, etc.) — StatusBar.svelte does the substitution.
  prompts:
    # "(rename-window) " prefix in front of the editable, prefilled window
    # name (Ctrl-b ,).
    renamePrefix: "(rename-window) "
    # Ctrl-b & and the Builds single-pane Ctrl-b x fallback.
    killWindowTemplate: "kill-window {name}? (y/n)"
    # Ctrl-b x inside Builds, when more than one panel remains.
    killPaneTemplate: "kill-pane {pane}? (y/n)"
    # Shown instead of removing the window when it's the only one left.
    killLastWindowMessage: "can't kill the only window"
    # Ctrl-b ] with no active text input, or an empty paste buffer.
    pasteEmptyMessage: "nothing to paste"

# Ctrl-b [ copy-mode overlay (PLAN.md Phase 5 item 5.3 / #12). One generic
# overlay reused across every view's `data-copy-source` pane — see
# CopyMode.svelte's header comment for the capture contract.
copyMode:
  titlePrefix: "COPY MODE"
  titleTilde: "~"
  hint: "j/k/h/l/gg/G move · Ctrl-d/u page · v select · y / Enter yank · q / Esc exit"
  emptyText: "(nothing to copy)"

mobileBlock:
  # README.md "Mobile policy" example copy, quoted verbatim.
  heading: "E.D.I.T.H: RETINA-V"
  body: "viewport too small — this session requires a desktop terminal (≥900px)."
  escapeHatchText: "github.com/shevinum"
  escapeHatchHref: "https://github.com/shevinum"
