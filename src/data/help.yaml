# Help window copy (PLAN.md Phase 1 item 13 / "Help window (#13)"). Single
# source of truth for every binding in the app — current AND future (rows
# for bindings that land in a later phase are marked `status: planned` so
# this file and README.md's keymap reference never drift out of sync as the
# plan progresses; nothing here is invented functionality, it's the plan's
# own design decisions written down ahead of the code that implements them).
#
# Reachable via `Ctrl-b ?` (tmux list-keys), `Ctrl-b 5`, a status-bar click
# on "5:help", and a click on the dashboard menu's Help row. Not to be
# confused with the site-wide `?` HelpSearch palette (its own "Help search"
# section below) — this window is the full reference table; that palette is
# a fuzzy jump-to for commands and a live search over these very rows.
#
# PLAN.md Iteration 4 item 15 sweep: every row description is now one
# concise, single-sentence line (aim <= ~90 chars) — this is a keymap
# reference, not a design doc. Rows that were pure prose (no key of their
# own, no binding to look up) were dropped rather than shortened; every
# remaining row still documents an actual key or command.

title: "Help — Keymap Reference"
scrollHint: "↑/↓ scrolls"
plannedNote: "planned — lands in a later phase"

sections:
  - title: "Global"
    rows:
      - key: "r"
        description: "reboot (any view) — replays the boot sequence"
      - key: "/"
        description: "open the grep overlay (any view; searches the buffer inside the editor)"
      - key: ":"
        description: "open the floating Cmdline box (any view, or the editor's ex-command line)"
      - key: "?"
        description: "open the HelpSearch palette (any view, unless another modal is open)"
      - key: "arrows"
        description: "move selection within the active pane"
      - key: "Enter"
        description: "open / drill in"
      - key: "Esc"
        description: "exits whatever's open (grep, filter, prompt, copy-mode, prefix) — never a view switch"
      - key: "held ⌘/Ctrl/Alt + key"
        description: "falls through untouched (browser/OS shortcuts still work)"

  - title: "Window switching (mouse)"
    rows:
      - key: "click a status-bar window"
        description: "jump straight to that window — 0:dashboard 1:builds 2:personnel 3:retina-v 4:profile 5:help"
      - key: "click a dashboard menu row"
        description: "same targets as their hotkeys"

  - title: "Builds"
    rows:
      - key: "1 / 2 / 3 / 4 / 0"
        description: "focus panel Status / Files / Local Repositories / Commits / Changes"
      - key: "arrows"
        description: "move selection within the focused panel"
      - key: "Enter (panel [3], a repo)"
        description: "load that repo's tree into panel [2] — same as clicking the row"
      - key: "click a repo row (panel [3])"
        description: "load that repo's tree into panel [2], same as Enter"
      - key: "click a file (panel [2])"
        description: "preview it in panel [0] — does not open the editor"
      - key: "Enter (a file in the tree)"
        description: "open the file in the full-screen vim editor"
      - key: "click / Enter on a directory (panel [2])"
        description: "toggle its expand/collapse state — every directory starts expanded"
      - key: "click a commit / Enter on a commit (panel [4])"
        description: "load that commit's tree into panel [2] (spinner on the repo row) — no new tab"
      - key: "o (panel [4], commits)"
        description: "opens the selected commit on GitHub in a new tab"

  - title: "tmux prefix (Ctrl-b)"
    rows:
      - key: "1 / 2 / 3 / 4 / 5"
        description: "jump straight to Builds / Personnel / Retina-V / Profile / Help"
      - key: "n"
        description: "next window, wrapping"
      - key: "p"
        description: "previous window (reverse cycle)"
      - key: "0"
        description: "dashboard"
      - key: "c"
        description: "new-window: creates and switches to a new window running the shell"
      - key: "d"
        description: "detach: drops to a fullscreen host shell; tmux a/tmux new/edith reattach"
      - key: "?"
        description: "Help (tmux list-keys style)"
      - key: "Esc"
        description: "cancel the prefix (no action)"
      - key: ","
        description: "rename-window: edit the status-bar name; Enter commits, Esc cancels"
      - key: "&"
        description: "kill-window: confirms, then removes it (the last one kills the session)"
      - key: "x"
        description: "kill-pane: always confirms, even solo; the last pane cascades to kill-window"
      - key: "| / %"
        description: "split horizontally: new shell pane to the right, focused"
      - key: '- / "'
        description: "split vertically: new shell pane below, focused"
      - key: "o"
        description: "next pane, cycling focus, wrapping"
      - key: ";"
        description: "last-pane: jump back to the previously-focused pane"
      - key: "arrow keys"
        description: "directional pane nav — nearest pane that way, or no-op"
      - key: "Space"
        description: "next-layout: cycles the 7 preset tmux layouts"
      - key: "w"
        description: "choose-tree: full-window overlay listing every session/window"
      - key: "Ctrl-b (send-prefix)"
        description: "a second Ctrl-b disarms and sends a literal Ctrl-b through (reaches vim page-back)"
      - key: "["
        description: "copy-mode: vim-navigate the pane's text, v selects, y/Enter yanks"
      - key: "]"
        description: "paste-buffer: inserts the last yank into the active text input"
      - key: "anything else"
        description: "silently swallowed (no action)"

  - title: "choose-tree (Ctrl-b w, PLAN.md Iteration 3 Phase 6)"
    rows:
      - key: "↑ / ↓"
        description: "move the selection across every visible row"
      - key: "h / ←"
        description: "window row: jump to its session; expanded session row: collapse it"
      - key: "l / →"
        description: "on a collapsed session row: expand it"
      - key: "Enter"
        description: "switch to the selected window or session, then close the overlay"
      - key: "x"
        description: "kill: confirms in-overlay (y or Y confirms, any other key cancels)"
      - key: "q / Esc"
        description: "close the overlay"
      - key: "(while open)"
        description: "Ctrl-b d/digits/n/p still work; ,/&/x/: are inert; ? doesn't open"

  - title: "Shell builtins (PLAN.md Iteration 3 Phase 4, src/data/shell.yaml is the source of truth)"
    rows:
      - key: "cd <path>"
        description: "change directory (relative or, with a leading /, absolute)"
      - key: "ls [path]"
        description: "list a directory's contents (defaults to the current directory)"
      - key: "cat <path>"
        description: "print a file's contents; errors on a missing path, directory, or unindexed file"
      - key: "pwd"
        description: "print the current directory"
      - key: "tree"
        description: "print the current directory as an ASCII tree, capped at depth 3"
      - key: "clear"
        description: "clear the scrollback"
      - key: "whoami"
        description: "print the current user (shev)"
      - key: "help"
        description: "list every builtin, verbatim from src/data/shell.yaml"
      - key: "view-names"
        description: "list the launchable programs — dashboard, builds, personnel, retina-v, profile, help"
      - key: "<view name> (pane shell, no open)"
        description: "relaunch that program in this pane"
      - key: "open <view>"
        description: "pane shell — relaunch; host shell — attach and jump to that window"
      - key: "vim <file> / vi / nvim"
        description: "open a file read-only in the vim editor; :q returns to the shell"
      - key: "neofetch"
        description: "ASCII glyph plus OS/host/shell/resolution fields and uptime (yaml/clock-driven)"
      - key: "sudo <anything>"
        description: "always the same refusal message — never runs anything"
      - key: "exit"
        description: "closes this pane (cascades to window/session/host on the last one)"
      - key: "reboot"
        description: "factory-resets the client, then replays the boot sequence"

  - title: "Shell & sessions (PLAN.md Iteration 3 Phase 5)"
    rows:
      - key: "tmux ls"
        description: "list every session (attached/unattached) — works from any shell"
      - key: "tmux new [-s <name>]"
        description: "host shell only — creates and attaches a session; duplicate -s name errors"
      - key: "tmux a / tmux attach [-t <name>]"
        description: "host shell only — attaches the most recent session, or -t by name"
      - key: "tmux new / tmux a (inside a pane)"
        description: "always refuses — real tmux's own nesting protection"
      - key: "open <view> (host shell)"
        description: "attaches the default session and jumps straight to that window"
      - key: "edith (host shell)"
        description: "attaches the default session at window 0 (dashboard)"
      - key: "<view name> (host shell, no open)"
        description: "not a launch — hints to attach first"
      - key: "exit (host shell)"
        description: "prints \"logout\", then reloads the page"

  - title: "Vim keys (file editor)"
    rows:
      - key: "j / k"
        description: "move the line cursor down/up"
      - key: "h"
        description: "up one level (Builds repo tree, Personnel employment-types/role-files levels)"
      - key: "gg"
        description: "jump to the first entry / top of file (double-tap within ~500ms)"
      - key: "G"
        description: "jump to the last entry / bottom of file"
      - key: "Ctrl-d / Ctrl-u"
        description: "half-page scroll"
      - key: "Ctrl-f / Ctrl-b"
        description: "full-page scroll (Ctrl-b send-prefix reaches it — see tmux prefix above)"
      - key: ":q / :q!"
        description: "close the file editor — the only way to close it (bare q/Esc no longer do)"
      - key: "click the [:q] pill"
        description: "same as :q — mouse parity for closing the editor"
      - key: "h l w b e 0 ^ $"
        description: "column motions — NORMAL mode, with numeric counts (5j, 3w)"
      - key: "v / V"
        description: "VISUAL / VISUAL-LINE selection; motions extend it, Esc cancels back to NORMAL"
      - key: "y / yy"
        description: "yank the selection / current line (3yy for 3 lines) to the paste buffer"
      - key: "/ (in-buffer), n / N"
        description: "search the open file and step through matches, with wraparound"
      - key: ": :w :wq :<number>"
        description: "ex-command line — :w/:wq show E45 readonly, :<number> jumps, else E492"
      - key: "i a o I A O c d x p s r ~ (etc.)"
        description: "every mutating key flashes a readonly-buffer message and changes nothing"

  - title: "Copy mode (Ctrl-b [)"
    rows:
      - key: "h / l / j / k / arrows"
        description: "move the copy-mode cursor over the captured pane text"
      - key: "gg / G"
        description: "jump to the first / last line"
      - key: "Ctrl-d / Ctrl-u"
        description: "page down / up"
      - key: "v"
        description: "start (or cancel) a charwise selection"
      - key: "y / Enter"
        description: "yank the selection (or current line) to the paste buffer, then exit"
      - key: "q / Esc"
        description: "exit copy-mode without yanking — bare q is intentionally allowed here"

  - title: "Grep overlay"
    rows:
      - key: "/"
        description: "open (from anywhere); a bare / while typing is otherwise just a printable character"
      - key: "printable characters"
        description: "append to the live query"
      - key: "Backspace"
        description: "delete the last query character"
      - key: "Ctrl-u / Ctrl-w"
        description: "clear the query"
      - key: "↓ / Ctrl-n (or Ctrl-j)"
        description: "next hit"
      - key: "↑ / Ctrl-p (or Ctrl-k)"
        description: "previous hit"
      - key: "Enter"
        description: "open the selected hit — routes to the owning view if the path maps to one"
      - key: "Esc / Ctrl-c"
        description: "close, no navigation"

  - title: "Personnel filter (f)"
    rows:
      - key: "f"
        description: "enter filter mode on the > prompt"
      - key: "click the > prompt"
        description: "also enters filter mode"
      - key: "any printable character"
        description: "appended to the filter query; the list live-filters (case-insensitive)"
      - key: "Backspace"
        description: "edit the filter query"
      - key: "Esc"
        description: "clear the filter and exit filter mode"
      - key: "Enter"
        description: "confirm the filter and return to normal navigation"

  - title: "Personnel navigation (mouse)"
    rows:
      - key: "click a row"
        description: "activates it immediately — a company, an employment type, or a role file"
      - key: "click ../"
        description: "up one level (role files -> employment types -> companies)"

  - title: "Profile"
    rows:
      - key: "r"
        description: "download resume.pdf in a new tab"

  - title: "Boot / reboot"
    rows:
      - key: "(fresh tab)"
        description: "the E.D.I.T.H boot sequence plays once automatically, unskippable"
      - key: "r"
        description: "from any view, replays the boot sequence (see the Global section above)"
      - key: "click ↻ reboot"
        description: "status-bar right cluster — switches to the dashboard and replays the boot sequence"

  - title: "Cmdline"
    rows:
      - key: ":"
        description: "opens a floating command box — window jumps, :grep, :reboot, :resume, :q"
      - key: ": (with a file editor open)"
        description: "same box, ex mode — :q/:q!/:w/:wq/:<number> plus every command above"
      - key: "Ctrl-b :"
        description: "same box, tmux command-prompt mode — rename/kill/select-window/select-layout"
      - key: "printable characters"
        description: "append to the typed command — no suggestion list is shown"
      - key: "Tab"
        description: "completes the command name; press again to cycle to the next match"
      - key: "Enter"
        description: "execute the typed command"
      - key: "Esc"
        description: "close the box — a modal exit, never a side effect"
      - key: "(unrecognized command)"
        description: "shows an E492-style error inside the box"

  - title: "Help search (?)"
    rows:
      - key: "?"
        description: "opens the Help palette — lists site-wide commands, fuzzy-searches everything"
      - key: "printable characters"
        description: "append to the typed query and live-filter the results"
      - key: "↑ / ↓"
        description: "move the highlighted row, wrapping around"
      - key: "Enter (on a command row)"
        description: "runs that command — same as a matching :command in Cmdline — and closes the palette"
      - key: "Enter (on a keymap row)"
        description: "reference-only — a deliberate no-op, the palette stays open"
      - key: "Backspace"
        description: "edits the typed query"
      - key: "Esc"
        description: "close the palette — a modal exit, never a side effect"
