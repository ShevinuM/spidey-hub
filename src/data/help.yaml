# Every binding in the app, grouped into scopes (sidebar tabs in
# HelpView.svelte). Copy rule: a first-time visitor with zero context must
# understand what pressing the key(s) does from `desc` alone — no file
# paths, no implementation mechanics, no internal names. `keys` are the
# literal chips rendered on the row; where a real key has more than one
# name (e.g. a split binding), each alternative is its own chip.

title: "Need some help?"
filterPlaceholder: "filter bindings…"
allScopeLabel: "All bindings"
emptyStateText: "No binding matches that filter."
legend:
  - "↑ / ↓ — scroll the list"
  - "? — opens the command search"
  - "Esc — leaves the filter box (keeps what you typed)"

scopes:
  - id: "global"
    label: "Global"
    hint: "works anywhere"
    rows:
      - name: "Reboot"
        keys: ["r"]
        desc: "Restarts the whole session from a blank terminal."
      - name: "Search everything"
        keys: ["/"]
        desc: "Opens a search box that looks across every file on the site."
      - name: "Command box"
        keys: [":"]
        desc: "Opens a small box for jumping to a window or running a command."
      - name: "Command search"
        keys: ["?"]
        desc: "Opens a searchable list of every command and shortcut."
      - name: "Move selection"
        keys: ["↑", "↓"]
        desc: "Moves the highlighted row in whichever list or tree is focused."
      - name: "Open"
        keys: ["Enter"]
        desc: "Opens or drills into the current selection."
      - name: "Dismiss"
        keys: ["Esc"]
        desc: "Closes whatever's open — never switches windows."

  - id: "windows"
    label: "Windows"
    hint: "mouse"
    rows:
      - name: "Status bar"
        keys: ["click"]
        desc: "Click a window name (0-5) to jump straight to it."
      - name: "Dashboard menu"
        keys: ["click"]
        desc: "Click a row on the dashboard to open that window."

  - id: "tmux"
    label: "tmux prefix"
    hint: "Ctrl-b, then a key"
    rows:
      - name: "Jump to window"
        keys: ["C-b", "1", "2", "3", "4", "5"]
        desc: "Switches straight to Builds, Personnel, Retina-V, Profile, or Help."
      - name: "Next window"
        keys: ["C-b", "n"]
        desc: "Moves to the next window, wrapping around."
      - name: "Previous window"
        keys: ["C-b", "p"]
        desc: "Moves to the previous window, wrapping around."
      - name: "Dashboard"
        keys: ["C-b", "0"]
        desc: "Jumps straight back to the dashboard."
      - name: "new-window"
        keys: ["C-b", "c"]
        desc: "Opens a new window running a fresh shell."
      - name: "detach"
        keys: ["C-b", "d"]
        desc: "Leaves the session for a fullscreen host shell; reattach any time."
      - name: "Help"
        keys: ["C-b", "?"]
        desc: "Opens this help page."
      - name: "Cancel the prefix"
        keys: ["C-b", "Esc"]
        desc: "Nothing happens — the prefix is dropped."
      - name: "rename-window"
        keys: ["C-b", ","]
        desc: "Renames the current window; Enter saves, Esc cancels."
      - name: "kill-window"
        keys: ["C-b", "&"]
        desc: "Confirms, then closes the window — the last one ends the session."
      - name: "kill-pane"
        keys: ["C-b", "x"]
        desc: "Confirms, then closes the focused pane — the last one closes the window."
      - name: "Split vertically"
        keys: ["C-b", "|", "%"]
        desc: "Opens a new pane to the right, focused."
      - name: "Split horizontally"
        keys: ["C-b", "-", '"']
        desc: "Opens a new pane below, focused."
      - name: "Next pane"
        keys: ["C-b", "o"]
        desc: "Cycles focus to the next pane, wrapping."
      - name: "last-pane"
        keys: ["C-b", ";"]
        desc: "Jumps back to the previously-focused pane."
      - name: "Directional pane nav"
        keys: ["C-b", "←", "↓", "↑", "→"]
        desc: "Moves focus to the nearest pane in that direction."
      - name: "Next layout"
        keys: ["C-b", "Space"]
        desc: "Cycles through the preset pane layouts."
      - name: "Session picker"
        keys: ["C-b", "w"]
        desc: "Opens a full-window list of every session and window."
      - name: "send-prefix"
        keys: ["C-b", "C-b"]
        desc: "Sends a literal Ctrl-b through to the focused pane."
      - name: "copy-mode"
        keys: ["C-b", "["]
        desc: "Freezes the pane so you can select and copy its text."
      - name: "paste-buffer"
        keys: ["C-b", "]"]
        desc: "Pastes whatever you last copied into the focused text input."

  - id: "builds"
    label: "Builds"
    hint: "window 1"
    rows:
      - name: "Focus a panel"
        keys: ["1", "2", "3", "4", "0"]
        desc: "Switches focus between panels [1] Status, [2] Files, [3] Repositories, [4] Commits, [0] Changes."
      - name: "Move selection"
        keys: ["↑", "↓"]
        desc: "Moves the highlighted row within the focused panel."
      - name: "Load a repo"
        keys: ["Enter", "click"]
        desc: "Loads the highlighted repo's file tree into panel [2]."
      - name: "Preview a file"
        keys: ["click"]
        desc: "Shows the file's contents in panel [0] without opening the editor."
      - name: "Open a file"
        keys: ["Enter"]
        desc: "Opens the highlighted file in the full-screen editor."
      - name: "Expand / collapse"
        keys: ["click", "Enter"]
        desc: "Toggles a directory open or closed in panel [2]."
      - name: "Load a commit"
        keys: ["click", "Enter"]
        desc: "Loads that commit's snapshot into panel [2]."
      - name: "Open on GitHub"
        keys: ["o"]
        desc: "Opens the highlighted commit on GitHub, in a new tab (panel [4])."

  - id: "session-picker"
    label: "Session picker"
    hint: "Ctrl-b w"
    rows:
      - name: "Move selection"
        keys: ["↑", "↓"]
        desc: "Moves the highlighted row across every listed session and window."
      - name: "Collapse / jump to session"
        keys: ["h", "←"]
        desc: "On a window row, jumps to its session; on an open session, collapses it."
      - name: "Expand a session"
        keys: ["l", "→"]
        desc: "Expands a collapsed session to show its windows."
      - name: "Switch"
        keys: ["Enter"]
        desc: "Switches to the selected window or session and closes this list."
      - name: "Close"
        keys: ["x"]
        desc: "Asks to confirm, then closes the selected window or session."
      - name: "Exit"
        keys: ["q", "Esc"]
        desc: "Closes this list without switching anything."

  - id: "shell"
    label: "Shell & sessions"
    hint: "type in any pane"
    rows:
      - name: "cd"
        keys: ["cd <path>"]
        desc: "Changes directory — relative, or absolute with a leading /."
      - name: "ls"
        keys: ["ls [path]"]
        desc: "Lists a directory's contents; defaults to the current directory."
      - name: "cat"
        keys: ["cat <path>"]
        desc: "Prints a file's contents."
      - name: "pwd"
        keys: ["pwd"]
        desc: "Prints the current directory."
      - name: "tree"
        keys: ["tree"]
        desc: "Prints the current directory as a tree, three levels deep."
      - name: "clear"
        keys: ["clear"]
        desc: "Clears the scrollback."
      - name: "whoami"
        keys: ["whoami"]
        desc: "Prints the current user."
      - name: "help"
        keys: ["help"]
        desc: "Lists every shell command."
      - name: "view-names"
        keys: ["view-names"]
        desc: "Lists the programs you can launch."
      - name: "Launch a program"
        keys: ["<name>"]
        desc: "Relaunches that program in the current pane."
      - name: "open"
        keys: ["open <view>"]
        desc: "Relaunches a program in this pane, or attaches and jumps to it from the host shell."
      - name: "vim"
        keys: ["vim", "vi", "nvim"]
        desc: "Opens a file read-only in the editor; :q returns to the shell."
      - name: "neofetch"
        keys: ["neofetch"]
        desc: "Prints a small system-info card."
      - name: "sudo"
        keys: ["sudo <...>"]
        desc: "Always refuses — nothing is ever run."
      - name: "exit"
        keys: ["exit"]
        desc: "Closes this pane — the last one closes the window, then the session."
      - name: "reboot"
        keys: ["reboot"]
        desc: "Resets the whole client and starts over."
      - name: "tmux ls"
        keys: ["tmux ls"]
        desc: "Lists every session, from any shell."
      - name: "tmux new"
        keys: ["tmux new [-s <name>]"]
        desc: "Creates and attaches a session — host shell only."
      - name: "tmux attach"
        keys: ["tmux a", "tmux attach"]
        desc: "Attaches the most recent session, or one by name — host shell only."
      - name: "edith"
        keys: ["edith"]
        desc: "Reattaches the default session, from the host shell."
      - name: "logout"
        keys: ["exit"]
        desc: "On the host shell, prints a logout message and reloads the page."

  - id: "editor"
    label: "File editor"
    hint: "read-only"
    rows:
      - name: "Move cursor"
        keys: ["↑", "↓", "←", "→"]
        desc: "Moves the cursor by line or column."
      - name: "Move cursor (vim)"
        keys: ["h", "j", "k", "l"]
        desc: "Vim-style alternative to the arrow keys."
      - name: "Word motions"
        keys: ["w", "b", "e"]
        desc: "Jumps forward or back by word."
      - name: "Line start / end"
        keys: ["0", "^", "$"]
        desc: "Jumps to the start or end of the line."
      - name: "Jump to top"
        keys: ["gg"]
        desc: "Jumps to the first line — press g twice quickly."
      - name: "Jump to bottom"
        keys: ["G"]
        desc: "Jumps to the last line."
      - name: "Half-page scroll"
        keys: ["Ctrl-d", "Ctrl-u"]
        desc: "Scrolls down or up by half a page."
      - name: "Full-page scroll"
        keys: ["Ctrl-f", "Ctrl-b"]
        desc: "Scrolls down or up by a full page."
      - name: "Visual select"
        keys: ["v", "V"]
        desc: "Starts character or line selection; a motion extends it."
      - name: "Yank"
        keys: ["y", "yy"]
        desc: "Copies the selection, or the current line, to the paste buffer."
      - name: "Search in file"
        keys: ["/", "n", "N"]
        desc: "Searches the open file and steps through matches."
      - name: "Ex commands"
        keys: [":", ":w", ":wq", ":<n>"]
        desc: "A colon command line — :w/:wq show a read-only notice, :<number> jumps there."
      - name: "Close"
        keys: [":q", ":q!"]
        desc: "Closes the editor — the only way out."
      - name: "Close (mouse)"
        keys: ["click [:q]"]
        desc: "Same as :q — click the pill to close."
      - name: "Editing keys"
        keys: ["i", "a", "o", "c", "d", "x", "p"]
        desc: "Every editing key shows a read-only notice and changes nothing."

  - id: "copy-mode"
    label: "Copy mode"
    hint: "Ctrl-b ["
    rows:
      - name: "Move cursor"
        keys: ["h", "j", "k", "l", "↑", "↓", "←", "→"]
        desc: "Moves the cursor over the frozen pane text."
      - name: "Jump to top / bottom"
        keys: ["gg", "G"]
        desc: "Jumps to the first or last line."
      - name: "Page scroll"
        keys: ["Ctrl-d", "Ctrl-u"]
        desc: "Scrolls down or up by half a page."
      - name: "Select"
        keys: ["v"]
        desc: "Starts (or cancels) a text selection."
      - name: "Copy"
        keys: ["y", "Enter"]
        desc: "Copies the selection (or current line) and exits copy mode."
      - name: "Exit"
        keys: ["q", "Esc"]
        desc: "Leaves copy mode without copying anything."

  - id: "grep"
    label: "Grep"
    hint: "search everything"
    rows:
      - name: "Open"
        keys: ["/"]
        desc: "Opens the search box, from anywhere."
      - name: "Type a query"
        keys: ["a-z", "0-9"]
        desc: "Appends to the search text."
      - name: "Edit query"
        keys: ["Backspace"]
        desc: "Removes the last character."
      - name: "Clear query"
        keys: ["Ctrl-u", "Ctrl-w"]
        desc: "Clears the whole search box."
      - name: "Next / previous hit"
        keys: ["↓", "↑"]
        desc: "Steps through the matching results."
      - name: "Open a hit"
        keys: ["Enter"]
        desc: "Opens the selected result, switching windows if it belongs to one."
      - name: "Close"
        keys: ["Esc", "Ctrl-c"]
        desc: "Closes the search box without navigating anywhere."

  - id: "personnel"
    label: "Personnel"
    hint: "window 2"
    rows:
      - name: "Move selection"
        keys: ["↑", "↓"]
        desc: "Moves the highlighted row up or down."
      - name: "Open selection"
        keys: ["Enter", "l", "→"]
        desc: "Opens the highlighted company, employment type, or role file."
      - name: "Go up a level"
        keys: ["h", "←", "Backspace"]
        desc: "Moves up — from role files to employment types to companies."
      - name: "Open a row"
        keys: ["click"]
        desc: "Opens a company, employment type, or role file immediately."
      - name: "Go up a level (mouse)"
        keys: ["click ../"]
        desc: "Moves up one level."
      - name: "Filter"
        keys: ["f"]
        desc: "Enters filter mode on the > prompt below the list."
      - name: "Filter prompt (mouse)"
        keys: ["click"]
        desc: "Click the > prompt to enter filter mode."
      - name: "Type to filter"
        keys: ["a-z", "0-9"]
        desc: "Narrows the list to rows matching what you type."
      - name: "Clear filter"
        keys: ["Esc"]
        desc: "Clears the filter and exits filter mode."
      - name: "Confirm filter"
        keys: ["Enter"]
        desc: "Keeps the filter text and returns to normal browsing."

  - id: "profile"
    label: "Profile"
    hint: "window 4"
    rows:
      - name: "Download résumé"
        keys: ["r"]
        desc: "Downloads the résumé as a PDF, in a new tab."

  - id: "cmdline"
    label: "Command box"
    hint: ":"
    rows:
      - name: "Open"
        keys: [":"]
        desc: "Opens a small box for jumping to a window or running a command."
      - name: "Open (editor)"
        keys: [":"]
        desc: "With a file editor open, the same box also takes :q, :w, and line jumps."
      - name: "Open (tmux)"
        keys: ["C-b", ":"]
        desc: "Same box, for tmux-style commands — rename, close, switch, layout."
      - name: "Type a command"
        keys: ["a-z"]
        desc: "Appends to the typed command."
      - name: "Complete"
        keys: ["Tab"]
        desc: "Completes the command name; press again for the next match."
      - name: "Run"
        keys: ["Enter"]
        desc: "Runs the typed command."
      - name: "Close"
        keys: ["Esc"]
        desc: "Closes the box without running anything."

  - id: "help-search"
    label: "Command search"
    hint: "?"
    rows:
      - name: "Open"
        keys: ["?"]
        desc: "Opens a searchable list of every command and shortcut."
      - name: "Type to search"
        keys: ["a-z"]
        desc: "Filters the list as you type."
      - name: "Move selection"
        keys: ["↑", "↓"]
        desc: "Moves the highlighted row, wrapping around."
      - name: "Run a command"
        keys: ["Enter"]
        desc: "Runs the highlighted command and closes the list."
      - name: "Reference row"
        keys: ["Enter"]
        desc: "On a keyboard-shortcut row, Enter does nothing — it's reference only."
      - name: "Close"
        keys: ["Esc"]
        desc: "Closes the list without running anything."

  - id: "boot"
    label: "Boot"
    hint: "startup"
    rows:
      - name: "Startup"
        keys: ["(new tab)"]
        desc: "Plays once automatically when you open the site; can't be skipped."
      - name: "Reboot"
        keys: ["r"]
        desc: "Restarts the session from a blank terminal, from anywhere."
      - name: "Reboot (mouse)"
        keys: ["click ↻"]
        desc: "Switches to the dashboard and restarts the session."
