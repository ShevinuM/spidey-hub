# Help window copy (PLAN.md Phase 1 item 13 / "Help window (#13)"). Single
# source of truth for every binding in the app — current AND future (rows
# for bindings that land in a later phase are marked `status: planned` so
# this file and README.md's keymap reference never drift out of sync as the
# plan progresses; nothing here is invented functionality, it's the plan's
# own design decisions written down ahead of the code that implements them).
#
# Reachable via `Ctrl-b ?` (tmux list-keys), `Ctrl-b 5`, a status-bar click
# on "5:help", and the dashboard menu's Help row (hotkey `h`). Not to be
# confused with the site-wide `?` HelpSearch palette (its own "Help search"
# section below) — this window is the full reference table; that palette is
# a fuzzy jump-to for commands and a live search over these very rows.

title: "Help — Keymap Reference"
scrollHint: "j/k scrolls"
plannedNote: "planned — lands in a later phase"

sections:
  - title: "Global"
    rows:
      - key: "b / p"
        description: "Builds (from the dashboard)"
      - key: "x"
        description: "Personnel Files (from the dashboard)"
      - key: "i"
        description: "Profile (from the dashboard)"
      - key: "t"
        description: "E.D.I.T.H: Retina-V (from the dashboard)"
      - key: "h"
        description: "Help (from the dashboard) — PLAN.md Iteration 3 Phase 3: replaces the old ? binding, freed up for the HelpSearch palette below"
      - key: "r"
        description: "reboot (from the dashboard only — replays the E.D.I.T.H boot sequence); Profile has its own r for downloading the resume, unrelated"
      - key: "/"
        description: "open the grep overlay (from any view — inside the vim file editor, / searches the open buffer instead; see Vim keys below)"
      - key: ":"
        description: "open the floating Cmdline box (from any view, and inside an open file editor as its ex-command line) — see Cmdline below; a literal : still types normally inside the grep query, the Personnel filter, and the rename prompt"
      - key: "?"
        description: "open the floating HelpSearch palette (from any view, including the dashboard) — see Help search below; does NOT open with a file editor open (the key falls through as an ordinary, no-op keystroke there instead), or while grep/Cmdline/a status-bar prompt/copy-mode is already up, or during boot"
      - key: "j / k / arrows"
        description: "move selection within the active pane"
      - key: "Enter"
        description: "open / drill in"
      - key: "Esc"
        description: "exits whatever's open — grep, a filter, a status-line prompt, copy-mode, the tmux prefix — never a view switch"
      - key: "held ⌘/Ctrl/Alt + key"
        description: "falls through untouched (browser/OS shortcuts still work)"

  - title: "Window switching (mouse)"
    rows:
      - key: "click a status-bar window"
        description: "jump straight to that window — 0:dashboard 1:builds 2:personnel 3:retina-v 4:profile 5:help"
      - key: "click a dashboard menu row"
        description: "same targets as their hotkeys"

  - title: "Builds"
    rows:
      - key: "1 / 2 / 3 / 4 / 0"
        description: "focus panel Status / Files (tree browser) / Local Repositories (every repo, flat, plus all-projects) / Commits / Changes (preview)"
      - key: "j / k"
        description: "move selection within the focused panel"
      - key: "Enter (panel [3], a repo)"
        description: "load that repo's tree into panel [2] — same as clicking the row"
      - key: "click a repo row (panel [3])"
        description: "load that repo's tree into panel [2], same as Enter"
      - key: "click a file (panel [2])"
        description: "preview it in panel [0] — does not open the editor"
      - key: "Enter (a file in the tree)"
        description: "open the file in the full-screen vim editor"
      - key: "click / Enter on a directory or ../ (panel [2])"
        description: "descend / go up one directory"
      - key: "h / Backspace (repo tree)"
        description: "up one directory"
      - key: "click a commit / Enter on a commit (panel [4])"
        description: "load that commit's tree into panel [2] (a lazygit-style loading spinner shows on the repo row) — no new tab"
      - key: "o (panel [4], commits)"
        description: "opens the selected commit on GitHub in a new tab — the only remaining external-link path in Builds"
      - key: "t"
        description: "E.D.I.T.H: Retina-V (works from Builds too, not only the dashboard)"
      - key: "gg / G"
        description: "jump to the first / last row of the open tree in panel [2] (also inside the file editor — see Vim keys below)"

  - title: "tmux prefix (Ctrl-b)"
    rows:
      - key: "1 / 2 / 3 / 4 / 5"
        description: "jump straight to Builds / Personnel / Retina-V / Profile / Help"
      - key: "n"
        description: "next window (dashboard → builds → personnel → retina-v → profile → help → dashboard …)"
      - key: "p"
        description: "previous window (reverse cycle)"
      - key: "0"
        description: "dashboard"
      - key: "d"
        description: "detach: drops to a fullscreen HOST shell over the dimmed radar — no status bar, no windows, keyboard belongs entirely to that shell (the tmux prefix itself is inert until you're attached again). Prints \"[detached (from session <name>)]\"; `tmux a`/`tmux new`/`edith`/`open <view>` from there all reattach — see the Shell & sessions section below"
      - key: "?"
        description: "Help (tmux list-keys style)"
      - key: "Esc"
        description: "cancel the prefix (no action)"
      - key: "(while the grep overlay is open)"
        description: "the prefix still works — it consumes the next key before grep ever sees it"
      - key: ","
        description: "rename-window: status bar swaps to an editable prompt prefilled with the current name; Enter commits, Esc cancels — while open it owns the keyboard, exactly like grep"
      - key: "&"
        description: "kill-window: status bar prompts \"kill-window <name>? (y/n)\"; y removes the window from the list and switches to the next remaining one if it was active. Killing the session's LAST window destroys the session outright (real tmux) — if another session still exists the client silently switches to the most recently used one, otherwise it detaches to the host shell printing \"[exited]\""
      - key: "x"
        description: "kill-pane (PLAN.md Iteration 3 Phase 6, Locked decision #4): ALWAYS prompts \"kill-pane <pane_index>? (y/n)\" in the status bar, even on a single-pane window — lowercase y confirms, any other key cancels. Destroying the last pane destroys the window by cascade (window → session → \"[exited]\", same chain as & below)"
      - key: "| / %"
        description: "split-window horizontally: a new shell pane appears to the RIGHT of the focused pane, 50/50, and becomes focused"
      - key: '- / "'
        description: "split-window vertically: a new shell pane appears BELOW the focused pane, 50/50, and becomes focused"
      - key: "o"
        description: "next pane: cycles focus through every pane in the window, in creation order, wrapping"
      - key: ";"
        description: "last-pane: jumps back to whichever pane was focused immediately before this one (toggles back and forth on repeated presses)"
      - key: "arrow keys"
        description: "directional pane nav: moves focus to the nearest pane geometrically in that direction from the currently-focused pane's rect; does nothing if there's no pane that way"
      - key: "Space"
        description: "next-layout: cycles the 7 preset layouts in order — even-horizontal → even-vertical → main-horizontal → main-horizontal-mirrored → main-vertical → main-vertical-mirrored → tiled → wraps back to even-horizontal"
      - key: "w"
        description: "choose-tree: full-window overlay listing every session/window (see the choose-tree section below) — REBINDS the old \"go home\" behavior"
      - key: "Ctrl-b (send-prefix)"
        description: "tmux's own default binding: a second Ctrl-b while the prefix is armed disarms it and dispatches a LITERAL Ctrl-b down to the view underneath — this is how vim's own Ctrl-b (full-page-back, see Vim keys below) is reachable at all, since a bare Ctrl-b is otherwise always consumed by the prefix arm"
      - key: "["
        description: "copy-mode: opens a generic overlay over the active pane's text (editor buffer, the focused Builds panel, the Personnel row list, the Profile summary, the tracker HUD, the Help content, or the dashboard menu) — vim-navigate it, v to start a selection, y/Enter to yank and exit, q/Esc to exit without yanking"
      - key: "]"
        description: "paste-buffer: inserts the last copy-mode/vim yank into the active text input (grep query, Personnel filter, the rename prompt, or the editor's in-buffer search) — a status-line message appears if nothing's active or nothing's been yanked yet"
      - key: "anything else"
        description: "silently swallowed (no action — mirrors real tmux's \"unbound prefixed key does nothing\")"

  - title: "choose-tree (Ctrl-b w, PLAN.md Iteration 3 Phase 6)"
    rows:
      - key: "(opening)"
        description: "a full window-content overlay (status bar stays visible below it); sessions are top-level rows (\"<name>: <n> windows[, (attached)]\"), windows nested under their session with ├─/└─ markers (\"<index>: <name><flags>\"); the current session starts expanded, every other session starts collapsed; the current window starts selected"
      - key: "j / k / ↑ / ↓"
        description: "move the selection across every visible row"
      - key: "h / ←"
        description: "on a window row: jump up to its parent session row; on an expanded session row: collapse it"
      - key: "l / →"
        description: "on a collapsed session row: expand it"
      - key: "Enter"
        description: "switch to the selected window (attaching its session first, if different) or session, then close the overlay"
      - key: "x"
        description: "kill: prompts an IN-OVERLAY \"Kill window <i>? (y/n)\" or \"Kill session <name>? (y/n)\" — y OR Y confirms (case-insensitive, a deliberate real-tmux quirk), any other key cancels just this sub-prompt, leaving the overlay open"
      - key: "q / Esc"
        description: "close the overlay"
      - key: "(bottom strip)"
        description: "previews the current selection — a window's own pane programs + applied layout, or a session's window count"
      - key: "(while open)"
        description: "Ctrl-b d still detaches (closing the overlay); Ctrl-b <digit>/n/p still switch windows (also closing it); Ctrl-b ,/&/x/: are inert (they'd pop a status-bar/Cmdline prompt this overlay would otherwise starve of its own keystrokes); the ? help palette does NOT open while this overlay is open"

  - title: "Shell & sessions (PLAN.md Iteration 3 Phase 5)"
    rows:
      - key: "tmux ls"
        description: "list every session (attached/unattached) — works from a pane shell or the host shell alike"
      - key: "tmux new [-s <name>]"
        description: "host shell only — creates a session (auto-numbered \"1\", \"2\", … without -s) and attaches it; a duplicate -s name errors"
      - key: "tmux a / tmux attach [-t <name>]"
        description: "host shell only — attaches the most recently used session (or the exact named one with -t); errors if none exist / the name doesn't match"
      - key: "tmux new / tmux a (inside a pane)"
        description: "always refuse — real tmux's own nesting protection (\"sessions should be nested with care, unset $TMUX to force\")"
      - key: "open <view> (host shell)"
        description: "attaches the default session and jumps straight to that window"
      - key: "edith (host shell)"
        description: "attaches the default session at window 0 (dashboard) — same command the boot mock's own command line uses to launch the site"
      - key: "<view name> (host shell, no open)"
        description: "not a launch — prints a hint to attach first (\"not attached — try: tmux a\")"
      - key: "exit (host shell)"
        description: "prints \"logout\", then reloads the page"

  - title: "Vim keys (file editor)"
    rows:
      - key: "j / k"
        description: "move the line cursor down/up (also works in Builds/Personnel lists)"
      - key: "h"
        description: "up one level (Builds repo tree, Personnel employment-types/role-files levels)"
      - key: "gg"
        description: "jump to the first entry / top of file (double-tap within ~500ms; a single g does nothing)"
      - key: "G"
        description: "jump to the last entry / bottom of file"
      - key: "Ctrl-d / Ctrl-u"
        description: "half-page scroll"
      - key: "Ctrl-f / Ctrl-b"
        description: "full-page scroll — Ctrl-b is normally consumed by the tmux prefix arm first, but Ctrl-b Ctrl-b (send-prefix, see the tmux prefix section above) dispatches a literal Ctrl-b through to here, so both directions are reachable from a real keypress"
      - key: ":q / :q!"
        description: "close the file editor, back to the browser view underneath (not the dashboard) — the ONLY way to close it; bare q/Esc no longer do (PLAN.md items 15/16)"
      - key: "click the [:q] pill"
        description: "same as :q — mouse parity for closing the editor"
      - key: "h l w b e 0 ^ $"
        description: "column motions — NORMAL mode, with numeric counts (5j, 3w)"
      - key: "v / V"
        description: "VISUAL / VISUAL-LINE selection; motions extend it, Esc cancels back to NORMAL"
      - key: "y / yy"
        description: "yank the selection / current line (3yy for 3 lines) to the paste buffer and system clipboard"
      - key: "/ (in-buffer), n / N"
        description: "search the open file and step through matches, with wraparound"
      - key: ": :w :wq :<number>"
        description: "ex-command line — :w/:wq show a readonly error, :<number> jumps to that line, anything else shows an E492-style error; Esc cancels"
      - key: "i a o I A O c d x p s r ~ (etc.)"
        description: "every mutating key flashes a readonly-buffer message and changes nothing — this viewer never writes"

  - title: "Copy mode (Ctrl-b [)"
    rows:
      - key: "h / l / j / k / arrows"
        description: "move the copy-mode cursor over the captured pane text"
      - key: "gg / G"
        description: "jump to the first / last line"
      - key: "Ctrl-d / Ctrl-u"
        description: "page down / up"
      - key: "v"
        description: "start (or cancel) a charwise selection"
      - key: "y / Enter"
        description: "yank the selection (or, with no selection, the cursor's current line) to the paste buffer + system clipboard, then exit — Ctrl-b ] pastes it elsewhere"
      - key: "q / Esc"
        description: "exit copy-mode without yanking — bare q is intentionally allowed here (and ONLY here): it never switches a view, it just closes this overlay"

  - title: "Grep overlay"
    rows:
      - key: "/"
        description: "open (from anywhere); a bare / while typing is otherwise just a printable character"
      - key: "printable characters"
        description: "append to the live query"
      - key: "Backspace"
        description: "delete the last query character"
      - key: "Ctrl-u / Ctrl-w"
        description: "clear the query"
      - key: "↓ / Ctrl-n (or Ctrl-j)"
        description: "next hit"
      - key: "↑ / Ctrl-p (or Ctrl-k)"
        description: "previous hit"
      - key: "gg / G"
        description: "jump to the first / last hit"
      - key: "Enter"
        description: "open the selected hit — routes to the owning view if the path maps to one, otherwise just closes"
      - key: "Esc / Ctrl-c"
        description: "close, no navigation"

  - title: "Personnel filter (f)"
    rows:
      - key: "f"
        description: "enter filter mode on the > prompt"
      - key: "click the > prompt"
        description: "also enters filter mode"
      - key: "any printable character"
        description: "appended to the filter query; the entry list live-filters (case-insensitive substring on names)"
      - key: "Backspace"
        description: "edit the filter query"
      - key: "Esc"
        description: "clear the filter and exit filter mode"
      - key: "Enter"
        description: "confirm the filter (exits typing; the filtered list stays applied) and returns to normal j/k navigation"

  - title: "Personnel navigation (mouse)"
    rows:
      - key: "click a row"
        description: "activates it immediately — a company, an employment type, or a role file"
      - key: "click ../"
        description: "up one level (role files -> employment types -> companies) — or the dashboard, at the companies root"

  - title: "Profile"
    rows:
      - key: "r"
        description: "download resume.pdf in a new tab"

  - title: "Boot / reboot"
    rows:
      - key: "(fresh tab)"
        description: "the E.D.I.T.H boot sequence plays once automatically; it is unskippable — no key or click bypasses it — and plays at most once per browser tab (a reload/deep-link later in the same tab skips straight to the dashboard)"
      - key: "r"
        description: "on the ready dashboard, replays the boot sequence (see the Global section above)"
      - key: "click ↻ reboot"
        description: "status-bar right cluster, reachable from any view — switches to the dashboard and replays the boot sequence"

  - title: "Cmdline"
    rows:
      - key: ":"
        description: "opens a floating command box (─ Cmdline ─, same visual family as the grep overlay) from any view — window jumps (:dashboard/:home, :builds, :personnel, :profile, :retina-v, :help), :grep <query> (opens grep pre-filled and already searching), :reboot, :resume/:cv (same as Profile's r), :q (quits the current program to a shell in this window — the window itself is never killed; that's Ctrl-b & / Ctrl-b x)"
      - key: ": (with a file editor open)"
        description: "same box, in ex mode — Phase-3's own :q/:q!/:w/:wq/:<number> PLUS every command above; a command the ex machine recognizes always wins (e.g. :q closes the editor first, never drops the pane to a shell)"
      - key: "Ctrl-b :"
        description: "same box, in tmux command-prompt mode: rename-window <name>, kill-window, kill-pane, select-window <0-5>, select-layout <name> — executed through the exact same underlying rename/kill/select/layout behavior as the , / & / x / digit / Space bindings above, without their interactive confirm step (a typed command is already deliberate); select-layout with no name reapplies whichever preset was last applied (a no-op if none has been); an unknown layout name errors"
      - key: "printable characters"
        description: "append to the typed command — no suggestion list is shown (PLAN.md Iteration 3 Phase 3: browsing/searching commands moved to the ? HelpSearch palette below; this box stays a plain, quiet command line)"
      - key: "Tab"
        description: "completes the command name; pressing Tab again immediately afterward (with no other key in between) cycles to the NEXT matching command, wrapping around — zsh-style repeated-Tab cycling, the only way multiple matches are still reachable now that the suggestion list is gone"
      - key: "Enter"
        description: "execute the typed command"
      - key: "Esc"
        description: "close the box — a modal exit, never a side effect"
      - key: "(unrecognized command)"
        description: "shows an E492-style error inside the box (vim's own \"not an editor command\" message, reused everywhere `:` is used, not just inside a file) — cleared by the next keystroke, Esc, or the next time the box opens"

  - title: "Help search (?)"
    rows:
      - key: "?"
        description: "opens the ─ Help ─ palette (from any view, including the dashboard) — empty query lists the site-wide commands (dashboard, builds, personnel, profile, retina-v, help, grep, reboot, resume); typing fuzzy-searches those commands PLUS every row of every section in THIS help window"
      - key: "(gating)"
        description: "does NOT open while a file editor is open (any mode), grep/Cmdline is open, a status-bar prompt (rename/kill confirm) is open, copy-mode is open, or during boot — ? falls through as an ordinary no-op keystroke in all of those instead"
      - key: "printable characters"
        description: "append to the typed query and live-filter the results — this includes q, j, k, and a second ? once the palette is already open: it is a plain text input, not a toggle"
      - key: "↑ / ↓"
        description: "move the highlighted row, wrapping around"
      - key: "Enter (on a command row)"
        description: "runs that command — the exact same action a matching :command in Cmdline would run — and closes the palette"
      - key: "Enter (on a keymap row)"
        description: "a keymap row is reference-only — it documents an existing binding, it isn't one itself — so Enter is a deliberate no-op (a brief flash), the palette stays open"
      - key: "Backspace"
        description: "edits the typed query"
      - key: "Esc"
        description: "close the palette — a modal exit, never a side effect"
