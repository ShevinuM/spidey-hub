# Help window copy (PLAN.md Phase 1 item 13 / "Help window (#13)"). Single
# source of truth for every binding in the app — current AND future (rows
# for bindings that land in a later phase are marked `status: planned` so
# this file and README.md's keymap reference never drift out of sync as the
# plan progresses; nothing here is invented functionality, it's the plan's
# own design decisions written down ahead of the code that implements them).
#
# Reachable via `Ctrl-b ?` (tmux list-keys), `Ctrl-b 5`, a status-bar click
# on "5:help", and the dashboard menu's Help row (hotkey `?`).

title: "Help — Keymap Reference"
scrollHint: "j/k scrolls"
plannedNote: "planned — lands in a later phase"

sections:
  - title: "Global"
    rows:
      - key: "b / p"
        description: "Builds (from the dashboard)"
      - key: "x"
        description: "Personnel Files (from the dashboard)"
      - key: "i"
        description: "Profile (from the dashboard)"
      - key: "t"
        description: "E.D.I.T.H: Retina-V (from the dashboard)"
      - key: "?"
        description: "Help (from the dashboard)"
      - key: "/"
        description: "open the grep overlay (from any view — inside the vim file editor, / searches the open buffer instead; see Vim keys below)"
      - key: "j / k / arrows"
        description: "move selection within the active pane"
      - key: "Enter"
        description: "open / drill in"
      - key: "Esc"
        description: "exits whatever's open — grep, a filter, a status-line prompt, copy-mode, the tmux prefix — never a view switch"
      - key: "held ⌘/Ctrl/Alt + key"
        description: "falls through untouched (browser/OS shortcuts still work)"

  - title: "Window switching (mouse)"
    rows:
      - key: "click a status-bar window"
        description: "jump straight to that window — 0:dashboard 1:builds 2:personnel 3:retina-v 4:profile 5:help"
      - key: "click a dashboard menu row"
        description: "same targets as their hotkeys"

  - title: "Builds"
    rows:
      - key: "1 / 2 / 3 / 4 / 0"
        description: "focus panel Status / Files (tree browser) / Local Repositories (every repo, flat, plus all-projects) / Commits / Changes (preview)"
      - key: "j / k"
        description: "move selection within the focused panel"
      - key: "Enter (panel [3], a repo)"
        description: "load that repo's tree into panel [2] — same as clicking the row"
      - key: "click a repo row (panel [3])"
        description: "load that repo's tree into panel [2], same as Enter"
      - key: "click a file (panel [2])"
        description: "preview it in panel [0] — does not open the editor"
      - key: "Enter (a file in the tree)"
        description: "open the file in the full-screen vim editor"
      - key: "click / Enter on a directory or ../ (panel [2])"
        description: "descend / go up one directory"
      - key: "h / Backspace (repo tree)"
        description: "up one directory"
      - key: "click a commit / Enter on a commit (panel [4])"
        description: "load that commit's tree into panel [2] (a lazygit-style loading spinner shows on the repo row) — no new tab"
      - key: "o (panel [4], commits)"
        description: "opens the selected commit on GitHub in a new tab — the only remaining external-link path in Builds"
      - key: "t"
        description: "E.D.I.T.H: Retina-V (works from Builds too, not only the dashboard)"
      - key: "gg / G"
        description: "jump to the first / last row of the open tree in panel [2] (also inside the file editor — see Vim keys below)"

  - title: "tmux prefix (Ctrl-b)"
    rows:
      - key: "1 / 2 / 3 / 4 / 5"
        description: "jump straight to Builds / Personnel / Retina-V / Profile / Help"
      - key: "n"
        description: "next window (dashboard → builds → personnel → retina-v → profile → help → dashboard …)"
      - key: "p"
        description: "previous window (reverse cycle)"
      - key: "d / w / 0"
        description: "dashboard"
      - key: "?"
        description: "Help (tmux list-keys style)"
      - key: "Esc"
        description: "cancel the prefix (no action)"
      - key: "(while the grep overlay is open)"
        description: "the prefix still works — it consumes the next key before grep ever sees it"
      - key: ","
        description: "rename-window: status bar swaps to an editable prompt prefilled with the current name; Enter commits, Esc cancels — while open it owns the keyboard, exactly like grep"
      - key: "&"
        description: "kill-window: status bar prompts \"kill-window <name>? (y/n)\"; y removes the window from the list and switches to the next remaining one if it was active (refuses, with a status message, to kill the last remaining window)"
      - key: "x"
        description: "kill-pane: inside Builds with more than one panel visible, confirms then removes the FOCUSED panel only (the rest keep their positions; the layout resets the next time Builds is opened); everywhere else — including Builds reduced to one panel — the only pane IS the window, so it's the exact same kill-window confirm as &"
      - key: "Ctrl-b (send-prefix)"
        description: "tmux's own default binding: a second Ctrl-b while the prefix is armed disarms it and dispatches a LITERAL Ctrl-b down to the view underneath — this is how vim's own Ctrl-b (full-page-back, see Vim keys below) is reachable at all, since a bare Ctrl-b is otherwise always consumed by the prefix arm"
      - key: "["
        description: "copy-mode: opens a generic overlay over the active pane's text (editor buffer, the focused Builds panel, the Personnel row list, the Profile summary, the tracker HUD, the Help content, or the dashboard menu) — vim-navigate it, v to start a selection, y/Enter to yank and exit, q/Esc to exit without yanking"
      - key: "]"
        description: "paste-buffer: inserts the last copy-mode/vim yank into the active text input (grep query, Personnel filter, the rename prompt, or the editor's in-buffer search) — a status-line message appears if nothing's active or nothing's been yanked yet"
      - key: "anything else"
        description: "silently swallowed (no action — mirrors real tmux's \"unbound prefixed key does nothing\")"

  - title: "Vim keys (file editor)"
    rows:
      - key: "j / k"
        description: "move the line cursor down/up (also works in Builds/Personnel lists)"
      - key: "h"
        description: "up one level (Builds repo tree, Personnel employment-types/role-files levels)"
      - key: "gg"
        description: "jump to the first entry / top of file (double-tap within ~500ms; a single g does nothing)"
      - key: "G"
        description: "jump to the last entry / bottom of file"
      - key: "Ctrl-d / Ctrl-u"
        description: "half-page scroll"
      - key: "Ctrl-f / Ctrl-b"
        description: "full-page scroll — Ctrl-b is normally consumed by the tmux prefix arm first, but Ctrl-b Ctrl-b (send-prefix, see the tmux prefix section above) dispatches a literal Ctrl-b through to here, so both directions are reachable from a real keypress"
      - key: ":q / :q!"
        description: "close the file editor, back to the browser view underneath (not the dashboard) — the ONLY way to close it; bare q/Esc no longer do (PLAN.md items 15/16)"
      - key: "click the [:q] pill"
        description: "same as :q — mouse parity for closing the editor"
      - key: "h l w b e 0 ^ $"
        description: "column motions — NORMAL mode, with numeric counts (5j, 3w)"
      - key: "v / V"
        description: "VISUAL / VISUAL-LINE selection; motions extend it, Esc cancels back to NORMAL"
      - key: "y / yy"
        description: "yank the selection / current line (3yy for 3 lines) to the paste buffer and system clipboard"
      - key: "/ (in-buffer), n / N"
        description: "search the open file and step through matches, with wraparound"
      - key: ": :w :wq :<number>"
        description: "ex-command line — :w/:wq show a readonly error, :<number> jumps to that line, anything else shows an E492-style error; Esc cancels"
      - key: "i a o I A O c d x p s r ~ (etc.)"
        description: "every mutating key flashes a readonly-buffer message and changes nothing — this viewer never writes"

  - title: "Copy mode (Ctrl-b [)"
    rows:
      - key: "h / l / j / k / arrows"
        description: "move the copy-mode cursor over the captured pane text"
      - key: "gg / G"
        description: "jump to the first / last line"
      - key: "Ctrl-d / Ctrl-u"
        description: "page down / up"
      - key: "v"
        description: "start (or cancel) a charwise selection"
      - key: "y / Enter"
        description: "yank the selection (or, with no selection, the cursor's current line) to the paste buffer + system clipboard, then exit — Ctrl-b ] pastes it elsewhere"
      - key: "q / Esc"
        description: "exit copy-mode without yanking — bare q is intentionally allowed here (and ONLY here): it never switches a view, it just closes this overlay"

  - title: "Grep overlay"
    rows:
      - key: "/"
        description: "open (from anywhere); a bare / while typing is otherwise just a printable character"
      - key: "printable characters"
        description: "append to the live query"
      - key: "Backspace"
        description: "delete the last query character"
      - key: "Ctrl-u / Ctrl-w"
        description: "clear the query"
      - key: "↓ / Ctrl-n (or Ctrl-j)"
        description: "next hit"
      - key: "↑ / Ctrl-p (or Ctrl-k)"
        description: "previous hit"
      - key: "gg / G"
        description: "jump to the first / last hit"
      - key: "Enter"
        description: "open the selected hit — routes to the owning view if the path maps to one, otherwise just closes"
      - key: "Esc / Ctrl-c"
        description: "close, no navigation"

  - title: "Personnel filter (f)"
    rows:
      - key: "f"
        description: "enter filter mode on the > prompt"
      - key: "click the > prompt"
        description: "also enters filter mode"
      - key: "any printable character"
        description: "appended to the filter query; the entry list live-filters (case-insensitive substring on names)"
      - key: "Backspace"
        description: "edit the filter query"
      - key: "Esc"
        description: "clear the filter and exit filter mode"
      - key: "Enter"
        description: "confirm the filter (exits typing; the filtered list stays applied) and returns to normal j/k navigation"

  - title: "Personnel navigation (mouse)"
    rows:
      - key: "click a row"
        description: "activates it immediately — a company, an employment type, or a role file"
      - key: "click ../"
        description: "up one level (role files -> employment types -> companies) — or the dashboard, at the companies root"

  - title: "Profile"
    rows:
      - key: "r"
        description: "download resume.pdf in a new tab"
