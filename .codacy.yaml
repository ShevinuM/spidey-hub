---
# Codacy analyses this repository through its GitHub integration and reports the
# `Codacy Static Code Analysis` check on every pull request. This file narrows what it
# grades. Two constraints before editing it:
#
#   - It only takes effect from the DEFAULT BRANCH. Codacy always reads the copy on
#     `main`; a pull request's own copy is considered for that pull request's analysis,
#     but the default branch takes precedence. Nothing here is fully live until merge.
#   - Its mere presence DISABLES the "Ignored files" settings in the Codacy UI. Once
#     this file exists it is the only place exclusions can be written.
#
# It also cannot enable or disable an engine — that is a Codacy UI operation on the
# Code patterns page. Paths are Java globs, relative to the repository root.
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/
exclude_paths:
  # The test suite: 16,366 lines of TypeScript across three roots. Codacy's job here is
  # the grade, the cyclomatic complexity and the trend of the product; grading the suite
  # alongside it would make all three describe the tests instead.
  - "**/tests/**"
  - "tests/**"
  # Machine-managed lockfile. `.prettierignore` exempts it on the same grounds. Codacy's
  # Semgrep hardcoded-tokens rule already failed a pull request here by matching the
  # package name `js-tokens: 10.0.0` as a credential; a lockfile is generated bytes.
  - "pnpm-lock.yaml"
  # Written by scripts/generate.mjs and rewritten on every build. Tracked so the build is
  # reproducible, not hand-written source. `.prettierignore`, `.jscpd.json` and
  # vitest's coverage config all exempt these for the same reason.
  - "src/generated/**"
  - "public/generated/**"
